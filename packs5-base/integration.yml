# Shared base of the jt-wazuh-mgr rule packs on Wazuh 5.x, installed once before any 5.x pack.
#
# Every space other than "standard" is its own policy: it needs a root decoder of its own and cannot
# use the standard decoders as parents (tested on 5.0.0-rc2: "Resource with UUID ... does not
# exist"). This integration supplies the root and a syslog header decoder; each pack's decoders
# hang under them. Its category is "unclassified", so an event that only matches these two (every
# event the pack decoders do not take) is not indexed a second time next to the standard copy.
category: unclassified
enabled: true
metadata:
  title: jt-base
  author: Jason Tools
  description: Root and syslog header decoders shared by the jt-wazuh-mgr rule packs on Wazuh 5.x.
  references:
    - https://github.com/jasoncheng7115/jt-wazuh-mgr
