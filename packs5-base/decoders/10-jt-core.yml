# Root of the jt-wazuh-mgr space: accepts every event. A JSON event body is parsed into _tmp_json
# for the decoders below.
name: decoder/jt-core/0
enabled: true
metadata:
  title: jt-wazuh-mgr root
  author: Jason Tools
  description: Root decoder of the jt-wazuh-mgr space; parses a JSON event body into _tmp_json.
  references:
    - https://github.com/jasoncheng7115/jt-wazuh-mgr
normalize:
  - check: "starts_with($event.original, '{')"
    map:
      - _tmp_json: parse_json($event.original)
