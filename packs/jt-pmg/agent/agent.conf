<!--
  jt-pmg agent group: the Proxmox Mail Gateway log that is not in syslog.
  Everything else PMG writes (logins, mail filter, quarantine, cluster sync,
  Postfix, ClamAV) goes to syslog, which the agent reads already from
  /var/log/syslog or /var/log/mail.log in its own ossec.conf.
-->
<agent_config os="Linux">

  <!-- REST API access. Kept: requests that change something, answered
       login ticket requests (the only record of a login's client address),
       configuration backup downloads and APT changelog requests (rules
       132498 and 132489; rare administrator actions).
       Dropped: all other GET and HEAD requests (what the web interface polls
       with), console tickets, and json ticket requests that failed, which
       pmgdaemon reports in syslog with the account and the address. -->
  <localfile>
    <location>/var/log/pmgproxy/pmgproxy.log</location>
    <log_format>syslog</log_format>
    <ignore type="PCRE2">"(?:GET|HEAD) (?!/api2/(?:json|extjs)/nodes/[^/ ]+/(?:backup/[^/? ]+|apt/changelog)[ ?])</ignore>
    <ignore type="PCRE2">"POST /api2/(?:json|extjs|htmlmail)/access/vncticket </ignore>
    <ignore type="PCRE2">"POST /api2/(?:json|extjs|htmlmail)/access/ticket HTTP/[0-9.]+" [^2]</ignore>
  </localfile>

</agent_config>
