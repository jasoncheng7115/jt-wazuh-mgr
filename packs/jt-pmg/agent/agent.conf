<!--
  jt-pmg agent group: the Proxmox Mail Gateway log that is not in syslog.
  Everything else PMG writes (logins, mail filter, quarantine, cluster sync,
  Postfix, ClamAV) goes to syslog, which the agent reads already from
  /var/log/syslog or /var/log/mail.log in its own ossec.conf.
-->
<agent_config os="Linux">

  <!-- REST API access. Only requests that change something are kept: GET
       and HEAD are what the web interface polls with, and the login ticket
       requests of API automation add one every few minutes; the result of a
       login is in syslog anyway. -->
  <localfile>
    <location>/var/log/pmgproxy/pmgproxy.log</location>
    <log_format>syslog</log_format>
    <ignore type="PCRE2">"(?:GET|HEAD) </ignore>
    <ignore type="PCRE2">"POST /api2/(?:json|extjs|htmlmail)/access/(?:ticket|vncticket) </ignore>
  </localfile>

</agent_config>
