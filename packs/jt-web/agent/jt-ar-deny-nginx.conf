# jt-wazuh-mgr, pack jt-web: addresses blocked by the jt-nginx-deny active response.
#
# Install once per nginx host, in a file nginx reads inside the http block and
# before any server block (the variable below must exist before a server uses
# it): for example /etc/nginx/conf.d/000-jt-ar-deny.conf, or the first file of
# whatever directory nginx.conf includes for the sites. Then create the two
# list files empty, run nginx -t and reload (see the pack's setup guide).
#
# 1. Every server and location: the deny list at http level. The access module
#    compares the client address after realip, so a site behind Cloudflare or
#    another proxy is blocked by the visitor's address, as long as realip trusts
#    only the proxy's ranges (set_real_ip_from), never 0.0.0.0/0.
#    nginx inherits allow/deny only into a server or location that has none of
#    its own: find those with
#      grep -rnE '^\s*(allow|deny)\s' /etc/nginx
#    and in each such block add "include /etc/nginx/jt-ar-deny.rules;" before
#    its own allow/deny lines (the first matching line wins), or use 2.
include /etc/nginx/jt-ar-deny.rules;

# 2. The same addresses as a variable, $jt_ar_denied (1 when blocked), for a
#    server whose locations keep their own access rules. A server-level
#      if ($jt_ar_denied) { return 403; }
#    runs before any location is chosen, so it covers all of them.
geo $jt_ar_denied {
    default 0;
    include /etc/nginx/jt-ar-deny.map;
}
