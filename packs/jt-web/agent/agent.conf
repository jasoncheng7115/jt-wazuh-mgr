<!--
  web: access and error logs of Apache and nginx, every file of every site.
  The default agent configuration only reads /var/log/apache2/access.log and
  /var/log/nginx/access.log, so sites that log to their own files were never
  analysed. Wildcards cover them; a file also listed elsewhere is read once.
  Built-in decoders handle the combined format (web-accesslog) and JSON lines
  (json), whatever log_format says here.
-->
<agent_config os="Linux">
  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/apache2/*access*.log</location>
  </localfile>
  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/apache2/*error*.log</location>
  </localfile>
  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/httpd/*access*log</location>
  </localfile>
  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/nginx/*access*.log</location>
  </localfile>
  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/nginx/*.combined.log</location>
  </localfile>
  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/nginx/*error*.log</location>
  </localfile>
</agent_config>
