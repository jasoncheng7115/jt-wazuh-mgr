<!--
  jt-ai-agent agent group: hosts where people run AI coding agents (Claude Code).

  1. The audit log the pack's hook writes, with the prefix the pack's decoder
     needs. If the host's own ossec.conf already reads this file, remove that
     block: the logcollector keeps one definition only.
  2. jt-ai-agent-hook.py and jt-ai-agent.logrotate arrive in
     /var/ossec/etc/shared/ with this group; install them as the pack's setup
     guide says (the hook is not run from the shared directory).
  3. File integrity for the hook and the managed Claude Code settings, so that
     removing or changing them is reported even when it is not done through
     an agent.
-->
<agent_config os="Linux">
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/jt-ai-agent/actions.log</location>
    <out_format>jt-ai-agent: $(log)</out_format>
  </localfile>

  <syscheck>
    <directories realtime="yes" check_all="yes" report_changes="yes">/etc/claude-code</directories>
    <directories realtime="yes" check_all="yes">/usr/local/lib/jt-ai-agent</directories>
  </syscheck>
</agent_config>
