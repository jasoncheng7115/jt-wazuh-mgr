<!--
  jt-ai-agent agent group: hosts where people run AI coding agents (Claude Code,
  Codex, opencode, Gemini CLI, Cursor, GitHub Copilot).

  1. The audit log the pack's hook writes, with the prefix the pack's decoder
     needs. If the host's own ossec.conf already reads this file, remove that
     block: the logcollector keeps one definition only.
  2. jt-ai-agent-hook.py and jt-ai-agent.logrotate arrive in
     /var/ossec/etc/shared/ with this group; install them as the pack's setup
     guide says (the hook is not run from the shared directory).
  3. File integrity for the hook, the opencode plugin and the managed settings
     of the other agents (Claude Code, Codex, Gemini CLI, Cursor, Copilot), so that
     removing or changing them is reported even when it is not done through
     an agent.
-->
<agent_config os="Linux">
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/jt-ai-agent/actions.log</location>
    <out_format>jt-ai-agent: $(log)</out_format>
  </localfile>

  <syscheck>
    <directories realtime="yes" check_all="yes" report_changes="yes">/etc/claude-code</directories>
    <directories realtime="yes" check_all="yes" report_changes="yes">/etc/codex</directories>
    <directories realtime="yes" check_all="yes" report_changes="yes">/etc/opencode/plugins</directories>
    <directories realtime="yes" check_all="yes" report_changes="yes">/etc/cursor</directories>
    <directories realtime="yes" check_all="yes" report_changes="yes">/etc/gemini-cli</directories>
    <directories realtime="yes" check_all="yes" report_changes="yes">/etc/github-copilot/policy.d</directories>
    <directories realtime="yes" check_all="yes">/usr/local/lib/jt-ai-agent</directories>
  </syscheck>
</agent_config>

<!-- 1.2: macOS (the installer uses /Library/Application Support for Claude Code and opencode) -->
<agent_config os="Darwin">
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/jt-ai-agent/actions.log</location>
    <out_format>jt-ai-agent: $(log)</out_format>
  </localfile>

  <syscheck>
    <directories realtime="yes" check_all="yes" report_changes="yes">/Library/Application Support/ClaudeCode</directories>
    <directories realtime="yes" check_all="yes" report_changes="yes">/etc/codex</directories>
    <directories realtime="yes" check_all="yes" report_changes="yes">/Library/Application Support/opencode/plugins</directories>
    <directories realtime="yes" check_all="yes" report_changes="yes">/Library/Application Support/Cursor</directories>
    <directories realtime="yes" check_all="yes" report_changes="yes">/Library/Application Support/GeminiCli</directories>
    <directories realtime="yes" check_all="yes" report_changes="yes">/etc/github-copilot/policy.d</directories>
    <directories realtime="yes" check_all="yes">/usr/local/lib/jt-ai-agent</directories>
  </syscheck>
</agent_config>

<!--
  1.6 (BETA): Windows. The PowerShell hook (jt-ai-agent-hook.ps1, installed by
  jt-ai-agent-install.ps1 to C:\Program Files\jt-ai-agent) writes the same lines to
  C:\ProgramData\jt-ai-agent\actions.log, marked "platform":"windows" and "hook":"ps1-beta".
  File integrity for the hook and each agent's system-wide configuration on Windows.
-->
<agent_config os="Windows">
  <localfile>
    <log_format>syslog</log_format>
    <location>C:\ProgramData\jt-ai-agent\actions.log</location>
    <out_format>jt-ai-agent: $(log)</out_format>
  </localfile>

  <syscheck>
    <directories realtime="yes" check_all="yes">C:\Program Files\jt-ai-agent</directories>
    <directories realtime="yes" check_all="yes" report_changes="yes">C:\Program Files\ClaudeCode</directories>
    <directories realtime="yes" check_all="yes" report_changes="yes">C:\ProgramData\OpenAI\Codex</directories>
    <directories realtime="yes" check_all="yes" report_changes="yes">C:\ProgramData\gemini-cli</directories>
    <directories realtime="yes" check_all="yes" report_changes="yes" restrict="hooks.json$">C:\ProgramData\Cursor</directories>
    <directories realtime="yes" check_all="yes" report_changes="yes">C:\ProgramData\GitHub\Copilot\policy.d</directories>
  </syscheck>
</agent_config>
