# jt-ai-agent settings for every host in this agent group (jt-ai-agent 1.6).
# The Wazuh manager delivers this file to the hosts; a root cron job on each host
# (jt-ai-agent-hook.py --sync-config, every five minutes) makes it readable for the
# hook, and each change is reported (rule 133779). Change it with jt-wazuh-mgr
# (Rule packs > jt-ai-agent > Settings) or edit it here on the manager.
#
# prompts: what happens to the prompts users send to an AI coding agent
#   off    not recorded (the default)
#   local  kept on the host only, in /var/log/jt-ai-agent/prompts.log (root can read
#          it; the Wazuh agent does not collect it); Wazuh gets the length and a hash
#   wazuh  as local, and the first 2,000 characters also go to Wazuh
# Passwords and tokens are replaced with *** in every case. Tell the people concerned
# before turning this on: prompts often carry personal and customer data.
prompts = off
