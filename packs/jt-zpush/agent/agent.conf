<!--
  jt-zpush agent group: the log files Z-Push writes itself.

  Read only z-push.log, not z-push-error.log: the error log repeats every
  WARN, ERROR and FATAL line of z-push.log, and reading both counts each
  failure twice. The per-user debug logs (LOGUSERLEVEL) are not needed.

  multi-line-regex: Z-Push keeps the newline of its version file inside the
  request summary, so that line is split in two after version='x.y.z; a
  new entry starts with the timestamp, and the continuation is joined with a
  space (which also leaves one at the end of every event).

  The ignores drop, on the agent, the informational lines no rule uses (about
  90 per cent of the log at the default LOGLEVEL_INFO: folder exports,
  message lists, waiting for changes) and the request summary of plain GET
  requests, which are monitoring probes and browsers. Kept: request summaries
  of every other request, new devices, remote wipes, loop detection, the user
  agent Z-Push logs before every exception and for every GET (except that of
  check_http, the monitoring probe: about 720 lines a day per probe), and
  every WARN, ERROR and FATAL line. From 1.3 also kept: the count of items a
  device is about to download when it is 5,000 or more in one folder (none in
  ten days on two hosts; rule 132290), and the Z-Push webservice's device
  management lines (132246 to 132248).

  If rsyslog already copies these files into /var/log/syslog (imfile), do
  not assign this group as well: every line would arrive twice.
-->
<agent_config os="Linux">

  <localfile>
    <location>/var/log/z-push/z-push.log</location>
    <log_format>multi-line-regex</log_format>
    <multiline_regex match="start" replace="wspace">^\d\d/\d\d/\d\d\d\d \d\d:\d\d:\d\d </multiline_regex>
    <ignore type="PCRE2">^\S+ \S+ \[\s*\d+\] \[ INFO\] \[[^\]]*\](?: \[[^\]]*\])? (?!cmd='|Linking device ID '|ASDevice id '|DeviceManager-\x3eProvisioningRequired|User '[^']*' has requested a remote wipe|LoopDetection-\x3e|User-agent: '(?!check_http/|check_curl/)|ExportChangesDiff-\x3eInitializeExporter\(\): Found '(?:[5-9]\d{3}|[1-9]\d{4,})' |Webservice(?:Device)?::(?:HandleWebservice|RemoveDevice|WipeDevice)\()</ignore>
    <ignore type="PCRE2"> method='GET' httpcode='200'\s*$</ignore>
    <ignore type="PCRE2">^\S+ \S+ \[\s*\d+\] \[(?:DEBUG|WBXML|DEVICEID|WBXMLSTACK)\] </ignore>
  </localfile>

  <!-- Autodiscover: only failures matter; its INFO lines are the version, GET
       requests and the server URL it hands out. -->
  <localfile>
    <location>/var/log/z-push/autodiscover.log</location>
    <log_format>multi-line-regex</log_format>
    <multiline_regex match="start" replace="wspace">^\d\d/\d\d/\d\d\d\d \d\d:\d\d:\d\d </multiline_regex>
    <ignore type="PCRE2">^\S+ \S+ \[\s*\d+\] \[(?: INFO|DEBUG|WBXML|DEVICEID|WBXMLSTACK)\] </ignore>
  </localfile>

</agent_config>
