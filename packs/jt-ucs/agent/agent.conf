<!--
  jt-ucs agent group: UCS domain controllers.

  Most of what the pack uses is in /var/log/syslog and /var/log/auth.log
  (slapd, the directory logger, PAM, sshd, systemd) and in
  /var/log/apache2/access.log, which a Debian agent reads already.
  The files below add the configuration registry's change log, which every
  UCS host writes when ucr/replog/enabled is yes, and the optional sources of
  the pack's setup guide; a file that does not exist is skipped by the agent.

  out_format gives the lines a syslog header with a program name of their
  own (samba-audit, ucr-replog). Samba's JSON audit lines and the replog lines
  have no program name, and a line that starts with a date would lose its
  first word to Wazuh's pre-decoder; the pack's decoders look for these names.
  If the agent's own ossec.conf reads one of these files as well, remove that
  block: the logcollector keeps only one definition of a file.

  NEVER add /var/log/univention/directory-logger.log here. Its records contain
  the password hashes of every changed account (userPassword, krb5Key,
  sambaNTPassword, pwhistory). The pack uses the directory logger's syslog
  line instead, which has no values.
-->
<agent_config os="Linux">

  <!-- UCS configuration registry changes (ucr set / unset), one line each. -->
  <localfile>
    <location>/var/log/univention/config-registry.replog</location>
    <log_format>syslog</log_format>
    <out_format>$(timestamp) $(hostname) ucr-replog: $(log)</out_format>
  </localfile>

  <!-- Samba JSON audit, one file per audit class (setup step "Samba audit"). -->
  <localfile>
    <location>/var/log/samba/jt-audit-auth.log</location>
    <log_format>syslog</log_format>
    <out_format>$(timestamp) $(hostname) samba-audit: $(log)</out_format>
  </localfile>

  <localfile>
    <location>/var/log/samba/jt-audit-password.log</location>
    <log_format>syslog</log_format>
    <out_format>$(timestamp) $(hostname) samba-audit: $(log)</out_format>
  </localfile>

  <localfile>
    <location>/var/log/samba/jt-audit-group.log</location>
    <log_format>syslog</log_format>
    <out_format>$(timestamp) $(hostname) samba-audit: $(log)</out_format>
  </localfile>

  <!-- Directory changes. The same audit class also logs every batch of
       changes replicated in from another DC (replicatedUpdate): no rule uses
       those, so they stay on the host. -->
  <localfile>
    <location>/var/log/samba/jt-audit-dsdb.log</location>
    <log_format>syslog</log_format>
    <out_format>$(timestamp) $(hostname) samba-audit: $(log)</out_format>
    <ignore type="PCRE2">^\s*\{"timestamp": "[^"]*", "type": "replicatedUpdate"</ignore>
  </localfile>

  <!-- Admin Diary entries, on the Admin Diary backend (setup step "Admin Diary"). -->
  <localfile>
    <location>/var/log/univention/jt-admindiary.log</location>
    <log_format>syslog</log_format>
  </localfile>

  <syscheck>
    <!-- failed.ldif appears here when replication to a Backup or Replica
         Directory Node stops (rule 131468). The directory does not exist on
         a Primary. -->
    <directories realtime="yes">/var/lib/univention-directory-replication</directories>
    <!-- Never store or send a diff of these files, even if a site enables
         report_changes for /etc: they hold the directory's administrative
         password, the machine password and private keys. -->
    <nodiff>/etc/ldap.secret</nodiff>
    <nodiff>/etc/ldap-backup.secret</nodiff>
    <nodiff>/etc/machine.secret</nodiff>
    <nodiff type="sregex">^/etc/univention/ssl/</nodiff>
  </syscheck>

</agent_config>
