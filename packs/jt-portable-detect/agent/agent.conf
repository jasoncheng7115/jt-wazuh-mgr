<!--
  jt-portable-detect — agent-side collection.

  Manager rules cannot see what the agent never reports. This is the
  collection the pack's rules depend on; assigning agents to the group is
  left to you, because deciding which hosts carry the cost is not a
  decision a pack installer should make on its own.

  What this costs, stated plainly:

    * Real-time monitoring of /tmp, /var/tmp and /dev/shm, to depth 2.
      These are small and mostly idle on a server, so this is cheap.

      The depth limit matters more than it looks. Without it, /tmp on a
      build host held 104,019 files against Wazuh's default whole-database
      limit of 100,000 — enough to stop the agent monitoring anything else.
      If you raise it, check `ossec.log` afterwards for "Reached maximum
      files limit monitored"; that warning means FIM coverage is being lost
      elsewhere, and nothing else will tell you.

    * A scheduled scan of the user download directories and /root. Not
      real-time: permission changes are still detected on the next scan,
      which is what rule 906201 keys on.

    * Reading /var/log/audit/audit.log, if auditd is present. Without it
      the file rules still work; only the two execution rules go quiet.
-->
<agent_config os="Linux">

  <syscheck>
    <disabled>no</disabled>

    <!--
      Places a program has no business living in.

      ★ recursion_level="2" is not a tuning knob, it is what keeps this
        configuration from breaking the file integrity monitoring it is
        deployed alongside.

        ★★ What the number means, measured from the agent's own database on
           2026-09-14 rather than assumed: recursion_level="2" records paths
           down to /tmp/<dir>/<dir>/<file> and no deeper, three levels
           below /tmp, which is `find -maxdepth 3`, not `-maxdepth 2`.
           The first version of this comment compared against maxdepth 2 and
           therefore claimed a far larger reduction than the setting gives.
           Check the depth by reading what the database actually holds, not
           by running find with the same number.

        Wazuh's default file limit for the whole FIM database is 100,000.
        So on that host /tmp alone exhausted the entire budget, and the log
        filled with "Reached maximum files limit monitored" and "Real-time
        inotify kernel queue is full. Some events may be lost." The cost is
        not noise — it is that /etc, /bin, /usr/bin and /root/.ssh stop
        being monitored reliably, silently apart from those warnings.

        Depth 2 keeps the shape this pack is looking for: an installer that
        unpacks to /tmp/<something>/setup. Everything that produced the
        false alerts measured on that host sat at depth 3 or deeper — git
        hook samples at 4, agent scratch directories at 6.
    -->
    <directories check_all="yes" realtime="yes" recursion_level="2">/tmp,/var/tmp,/dev/shm</directories>

    <!-- Where people put things they downloaded. The scheduled scan is
         enough: rule 906201 fires on a mode change, which a scan sees. -->
    <directories check_all="yes" recursion_level="3">/root,/home/*/Downloads,/home/*/Desktop</directories>

    <!-- Noise that is the operating system doing its job.

         ★ syscheck <ignore type="sregex"> is OS_Match: the only special
           characters are ^ $ | and !. Brackets, parentheses and backslashes
           are literal, so the earlier "^/tmp/snap[.-]" looked for those very
           characters. Every pattern here uses top-level | alternation and
           literal dots. -->
    <ignore type="sregex">^/tmp/systemd-private-</ignore>
    <ignore type="sregex">^/tmp/snap.|^/tmp/snap-</ignore>
    <ignore type="sregex">^/tmp/.X11-unix|^/tmp/.ICE-unix|^/tmp/.font-unix|^/tmp/.Test-unix</ignore>
    <ignore type="sregex">^/var/tmp/systemd-private-</ignore>
    <ignore type="sregex">^/tmp/ossec|^/tmp/wazuh</ignore>

    <!--
      Caches that tools rewrite constantly and that nobody runs a portable
      program out of. Added 2026-09-28, when the manager rule that used to
      swallow every event under /root and /tmp (906200) was retired: without
      it the built-in 550/553/554 alerts for these paths come back, which is
      correct for /root/.ssh and wrong for a package cache.

      Measured on a developer host over seven days: 765 changes under
      ~/.claude/file-history and 295 under /tmp/pytest-of-root, against five
      in total on a hypervisor. An <ignore> also keeps these files out of the
      FIM database, whose size is capped — a rule exclusion would not.

      ~/.claude is ignored only for the history and transcripts it writes on
      every keystroke. settings.json stays monitored: its hooks run shell
      commands, so a change there is a change to what executes.
    -->
    <ignore type="sregex">^/root/.cache/|^/root/.npm/|^/root/snap/|^/root/.cargo/registry/|^/root/.rustup/|^/root/go/pkg/</ignore>
    <ignore type="sregex">^/root/.local/share/claude/|^/root/.local/share/pnpm/|^/root/.local/share/uv/|^/root/.local/share/virtualenv/</ignore>
    <ignore type="sregex">^/root/.claude/file-history/|^/root/.claude/projects/|^/root/.claude/todos/|^/root/.claude/shell-snapshots/|^/root/.claude/statsig/|^/root/.claude/plans/|^/root/.claude/session-env/|^/root/.claude/debug/</ignore>
    <ignore type="sregex">^/tmp/pytest-of-|^/tmp/playwright-transform-cache|^/tmp/node-compile-cache|^/tmp/v8-compile-cache</ignore>
  </syscheck>

  <!-- Execution evidence. Needs auditd running with the pack's
       jt-portable.rules loaded; see that file for how to install it.
       Harmless to leave here when auditd is absent: the agent simply
       finds no such file. -->
  <localfile>
    <location>/var/log/audit/audit.log</location>
    <log_format>audit</log_format>
  </localfile>

</agent_config>

<!--
  Windows. Process creation, file creation and download marks come from
  Sysmon, which this group does not configure — Sysmon's own configuration
  file decides what is recorded. See agent/sysmon-jt-portable.xml for the
  pieces the rules depend on.

  AppLocker is collected here because nothing else in a default estate
  collects it: rules 906110 and 906111 had never fired anywhere, and the
  channels were simply not being read. On an edition or host without an
  AppLocker policy the channels exist but stay empty, so this costs nothing.
-->
<agent_config os="Windows">

  <localfile>
    <location>Microsoft-Windows-AppLocker/EXE and DLL</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <localfile>
    <location>Microsoft-Windows-AppLocker/MSI and Script</location>
    <log_format>eventchannel</log_format>
  </localfile>

</agent_config>

<agent_config os="Darwin">

  <syscheck>
    <disabled>no</disabled>
    <directories check_all="yes" realtime="yes" recursion_level="2">/tmp,/var/tmp</directories>
    <directories check_all="yes" recursion_level="3">/Users/*/Downloads,/Users/*/Desktop</directories>
    <ignore type="sregex">^/tmp/ossec|^/tmp/wazuh</ignore>
    <ignore type="sregex">^/var/tmp/com.apple.</ignore>
  </syscheck>

</agent_config>
