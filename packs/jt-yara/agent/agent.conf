<!--
  jt-yara - agent group "yara".

  Membership means "this host should scan with YARA": the manager's jt-yara-inventory.py
  reports a member that never sent a status line (YARA not installed, 133442) or stopped
  (133441). Hosts can also be listed in etc/jt-packs/jt-yara.conf instead (expected = ...),
  which needs no agent restart.

  The group delivers the scanner's scripts to /var/ossec/etc/shared/ (jt-yara-install.sh
  installs them) and watches the scanner itself with file integrity monitoring, so Wazuh's
  own inventory shows which hosts have it and a removed scanner raises 133450 at once,
  without waiting for the daily status line.
-->
<agent_config os="Linux">
  <!-- scan results, quarantines and the daily status line are written here; the default agent
       configuration reads it, but a host whose ossec.conf was trimmed (one domain controller
       here, 2026-11-22) sent nothing until it was added -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/ossec/logs/active-responses.log</location>
  </localfile>

  <syscheck>
    <directories realtime="yes" check_all="yes">/usr/local/bin/yr,/usr/local/sbin/jt-yara-status,/usr/local/sbin/jt-yara-update,/etc/cron.d/jt-yara-status,/etc/cron.d/jt-yara-update</directories>
    <directories realtime="yes" check_all="yes">/var/ossec/active-response/bin/jt-yara.sh,/var/ossec/active-response/bin/jt-yara-quarantine.sh</directories>
    <directories realtime="yes" check_all="yes">/var/ossec/etc/yara</directories>
  </syscheck>
</agent_config>
