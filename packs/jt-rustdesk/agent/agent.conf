<!--
  jt-rustdesk agent group: the RustDesk server's own log files.

  The paths are those of the Debian / Ubuntu packages (rustdesk-server-hbbs,
  rustdesk-server-hbbr), which log to /var/log/rustdesk-server/. The container
  images (rustdesk/rustdesk-server) log to stdout instead: send the container
  log to a file (for example docker's json-file driver read with
  log_format json, or a bind-mounted file) and point a location there.

  No out_format prefix is needed: the pack's decoder recognises RustDesk's own
  line format. A host whose ossec.conf already reads these files keeps working
  either way (the agent keeps one definition per file and warns about the
  duplicate); remove the local block to rely on the group.
-->
<agent_config os="Linux">

  <localfile>
    <location>/var/log/rustdesk-server/hbbs.log</location>
    <log_format>syslog</log_format>
  </localfile>

  <localfile>
    <location>/var/log/rustdesk-server/hbbr.log</location>
    <log_format>syslog</log_format>
  </localfile>

</agent_config>
