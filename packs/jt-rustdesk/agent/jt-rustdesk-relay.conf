# jt-rustdesk log relay for rsyslog (jt-rustdesk 1.1.1)
# Copyright Jason Tools Co., Ltd. / AGPL-3.0-or-later
#
# Install on the RustDesk server as /etc/rsyslog.d/60-jt-rustdesk.conf, after
# jt-rustdesk-names has written /etc/rsyslog.d/jt-rustdesk-names.json once (rsyslog will
# not start a lookup table whose file is missing), then
#   rsyslogd -N1 && systemctl restart rsyslog
#
# Why: hbbs logs a device by its RustDesk ID only (update_pk 123456789 ...), and
# the open-source server never learns the computer's name. This copies hbbs.log
# to /var/log/jt-rustdesk/hbbs.log and, when the ID is in the lookup table,
# appends " jt_host=<name>" to the line; the pack decodes it as
# rustdesk.hostname. Lines without a known ID are copied unchanged, and the
# original hbbs.log is never touched. hbbr.log carries no IDs and is read as is.
#
# The appended field is always the last thing on the line, and the decoder only
# accepts it there: an update_pk line ends with the client's own key bytes, so a
# client could put " jt_host=x" inside them, but never after our suffix.
# Names are limited to letters, digits, dot, dash and underscore by
# jt-rustdesk-names, so a name cannot break the line either.

# 1.1.1: the table lives in /etc/rsyslog.d/ because Ubuntu's AppArmor profile for rsyslogd
# lets it read only its own configuration directories (a table under /etc/jt-rustdesk/ fails
# with "Permission denied"); only *.conf files there are read as configuration.
# imfile is loaded here: remove the next line if another file in /etc/rsyslog.d/ or
# /etc/rsyslog.conf already loads it (rsyslog then reports the module as loaded twice).
module(load="imfile")

lookup_table(name="jt_rustdesk_names" file="/etc/rsyslog.d/jt-rustdesk-names.json" reloadOnHUP="on")

template(name="jt_rustdesk_line" type="string" string="%$.jt_line%\n")

ruleset(name="jt_rustdesk_hbbs") {
    set $.jt_id = re_extract($msg, "(update_pk|IP change of) ([A-Za-z0-9_-]{6,32}) ", 0, 2, "");
    set $.jt_name = "";
    if $.jt_id != "" then {
        set $.jt_name = lookup("jt_rustdesk_names", $.jt_id);
    }
    if $.jt_name != "" then {
        set $.jt_line = $msg & " jt_host=" & $.jt_name;
    } else {
        set $.jt_line = $msg;
    }
    action(type="omfile" file="/var/log/jt-rustdesk/hbbs.log" template="jt_rustdesk_line"
           dirCreateMode="0750" fileCreateMode="0640")
    stop
}

input(type="imfile" file="/var/log/rustdesk-server/hbbs.log" tag="jt-rustdesk-hbbs:"
      ruleset="jt_rustdesk_hbbs" reopenOnTruncate="on")
