<agent_config>

  <!--
    jt-opnsense agent group, for OPNsense firewalls running the os-wazuh-agent plugin.

    Almost everything this pack reads arrives through the plugin's own file,
    /var/ossec/logs/opnsense_syslog.log, which the plugin fills with the syslog
    applications ticked in its settings (Services > Wazuh Agent > Settings).
    That selection is made in the OPNsense web interface, not here: see the
    pack's setup guide for the list.

    The one log outside syslog is CrowdSec's (os-crowdsec writes its own file,
    log_media "file"). On a firewall without CrowdSec the file does not exist and
    the agent skips it.

    Only CrowdSec's decisions, the overflows behind them and fatal errors are
    kept; the rest of its log (start-up, hub updates, parser chatter) is dropped
    on the firewall.
  -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/crowdsec/crowdsec.log</location>
    <restrict type="PCRE2">msg="\([^)]*\) \S+ .* : |msg="(?:Ip|Range) \S+ performed '|level=(?:fatal|panic) </restrict>
  </localfile>

  <!--
    File integrity (added in 1.2). The plugin's own FIM covers /etc, /bin, /sbin,
    /usr/bin, /usr/sbin and /boot every 12 hours when its "File integrity
    monitoring" option is on; FreeBSD has no real-time mode. Added here, small
    and rarely changed outside a firmware update:
      actions.d       configd actions; a new file is a new root command that the
                      web interface, cron and the API can call (persistence)
      rc.syshook.d    scripts OPNsense runs at boot and on events
      /root/.ssh      root's authorized_keys
    Modification time and inode are not compared: a firmware update reinstalls
    these files, and only a real change of content, owner or mode should alert
    (the built-in FIM rules 550, 553, 554). Without the plugin's FIM option this
    block does nothing.
  -->
  <syscheck>
    <directories check_all="yes" check_mtime="no" check_inode="no">/usr/local/opnsense/service/conf/actions.d,/usr/local/etc/rc.syshook.d,/root/.ssh</directories>
  </syscheck>

  <!--
    Daily checks (added in 1.2). Commands in a group configuration run only when
    the plugin's remote commands option is on (logcollector.remote_commands=1);
    otherwise the agent logs "Remote commands are not accepted from the manager.
    Ignoring it on the agent.conf" once at start and skips these two entries,
    and the rest of this file still applies.
      pkg audit -F   fetches FreeBSD's vulnerability list and checks the installed
                     packages (the same check as System > Firmware > Status, Audit)
      opnsense-version  prints e.g. "OPNsense 26.1.2 (amd64)"
  -->
  <localfile>
    <log_format>command</log_format>
    <command>/usr/local/sbin/pkg-static audit -F</command>
    <alias>jt-opnsense-pkg-audit</alias>
    <frequency>86400</frequency>
  </localfile>

  <localfile>
    <log_format>command</log_format>
    <command>/usr/local/sbin/opnsense-version</command>
    <alias>jt-opnsense-version</alias>
    <frequency>86400</frequency>
  </localfile>

</agent_config>
