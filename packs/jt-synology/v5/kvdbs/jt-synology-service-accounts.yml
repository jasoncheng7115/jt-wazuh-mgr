# Optional tuning: storage or monitoring accounts whose sign-ins from private addresses are routine.
# A listed account that is also a built-in administrator name (admin, root) or listed as an
# administrator raises nothing from a private address; from outside it still does, and so do its
# failures and shell logins. Key = the account exactly as DSM writes it. Ships with a placeholder only.
metadata:
  title: jt-synology-service-accounts
  author: Jason Tools
  description: Service accounts of Synology DSM (jt-synology, 4.x CDB list etc/lists/jt-synology-service-accounts).
enabled: true
content:
  SERVICE-ACCOUNT-NAME: placeholder
