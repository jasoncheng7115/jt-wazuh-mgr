# DSM lines that decoder/jt-syslog/0 cannot split into a program name. Only these shapes are taken:
#   DSM 6, which writes the acting account after the category (a blank, not a colon, after it):
#     Apr 19 14:13:02 nas1 Connection SYSTEM: User [alice] from [192.0.2.10] failed to log in via [DSM] due to authorization failure.
#     Oct 11 11:12:30 nas1 Backup SYSTEM:<tab>[Network][Daily] Failed to run backup task.
#   the file transfer logs (one line per file operation, a blank before the colon):
#     Oct 11 11:20:02 nas1 WinFileService Event: delete, Path: /share/a.docx, File/Folder: File, Size: 18.77 KB, User: alice, IP: 192.0.2.10
#   the IETF format (RFC 5424), with a DSM category as APP-NAME or a file transfer event as message:
#     1 2026-10-11T11:12:30+08:00 nas1 Connection - - [meta sequenceId="5"] User [alice] from [192.0.2.10] ...
# Every shape leaves the same fields as decoder/jt-synology-syslog/0: _syno.cat (Connection, System,
# Hyper_Backup or file), _syno.actor, message, host.hostname, process.name.
name: decoder/jt-synology-raw/0
enabled: true
metadata:
  title: Synology DSM 6, IETF and file transfer lines
  author: Jason Tools
  description: DSM lines without a syslog program name (DSM 6, RFC 5424, file transfer logs); the event is classified by decoder/jt-synology/0.
  references:
    - https://www.rfc-editor.org/rfc/rfc5424
parents:
  - decoder/jt-core/0
check: "regex_match($event.original, '^(<[0-9]{1,3}>)?[A-Z][a-z]{2} +[0-9]{1,2} [0-9]{2}:[0-9]{2}:[0-9]{2} [^ ]+ ((Connection|System|Backup|Hyper_Backup) [^]:[:space:]]+:[[:space:]]|[A-Za-z0-9_]+ Event:[ ][A-Za-z0-9_]+, Path:[ ])') OR (regex_match($event.original, '^(<[0-9]{1,3}>)?1 [0-9]{4}-[0-9]{2}-[0-9]{2}T[^ ]+ [^ ]+ [^ ]+ [^ ]+ [^ ]+ (-|([[]([^]\"]|\"[^\"]*\")*[]])+) ') AND (regex_match($event.original, '^(<[0-9]{1,3}>)?1 [^ ]+ [^ ]+ (Connection|System|Hyper_Backup) ') OR regex_match($event.original, '^(<[0-9]{1,3}>)?1 [^ ]+ [^ ]+ [^ ]+ [^ ]+ [^ ]+ (-|([[]([^]\"]|\"[^\"]*\")*[]])+) Event:[ ][A-Za-z0-9_]+, Path:[ ]')))"
normalize:
  - map:
      - event.kind: event

  # Time and host from either header; a line whose time does not parse keeps everything else.
  - parse|event.original:
      - "<?_tmp.pri/between/</\\>><event.start/%b %d %T> <host.hostname> <~>"
      - "<?_tmp.pri/between/</\\>>1 <event.start/2026-10-11T10:00:00+08:00> <host.hostname> <~>"
      - "<?_tmp.pri/between/</\\>>1 <event.start/2026-10-11T10:00:00.123456+08:00> <host.hostname> <~>"
      - "<?_tmp.pri/between/</\\>>1 <event.start/ISO8601Z> <host.hostname> <~>"
      - "<?_tmp.pri/between/</\\>>1 <~> <host.hostname> <~>"

  # BSD, DSM 6: "Category ACTOR: message"
  - check: "regex_match($event.original, '^(<[0-9]{1,3}>)?[A-Z][a-z]{2} +[0-9]{1,2} [0-9:]{8} [^ ]+ (Connection|System|Backup|Hyper_Backup) [^]:[:space:]]+:[[:space:]]')"
    map:
      - _syno.cat: "regex_extract($event.original, '^(?:<[0-9]{1,3}>)?[A-Z][a-z]{2} +[0-9]{1,2} [0-9:]{8} [^ ]+ ([A-Za-z_]+) ')"
      - _syno.actor: "regex_extract($event.original, '^(?:<[0-9]{1,3}>)?[A-Z][a-z]{2} +[0-9]{1,2} [0-9:]{8} [^ ]+ [A-Za-z_]+ ([^]:[:space:]]+):')"
      - message: "regex_extract($event.original, '^(?:<[0-9]{1,3}>)?[A-Z][a-z]{2} +[0-9]{1,2} [0-9:]{8} [^ ]+ [A-Za-z_]+ [^]:[:space:]]+:[[:space:]]+(.*)$')"

  # BSD, file transfer: "Service Event: action, Path: ..."
  - check: "regex_match($event.original, '^(<[0-9]{1,3}>)?[A-Z][a-z]{2} +[0-9]{1,2} [0-9:]{8} [^ ]+ [A-Za-z0-9_]+ Event:[ ]')"
    map:
      - _syno.cat: file
      - event.provider: "regex_extract($event.original, '^(?:<[0-9]{1,3}>)?[A-Z][a-z]{2} +[0-9]{1,2} [0-9:]{8} [^ ]+ ([A-Za-z0-9_]+) Event:[ ]')"
      - message: "regex_extract($event.original, '^(?:<[0-9]{1,3}>)?[A-Z][a-z]{2} +[0-9]{1,2} [0-9:]{8} [^ ]+ [A-Za-z0-9_]+ (Event:[ ].*)$')"

  # IETF: VERSION TIMESTAMP HOSTNAME APP-NAME PROCID MSGID STRUCTURED-DATA MSG
  - check: "regex_match($event.original, '^(<[0-9]{1,3}>)?1 ')"
    map:
      - _syno.cat: "regex_extract($event.original, '^(?:<[0-9]{1,3}>)?1 [^ ]+ [^ ]+ ([^ ]+) ')"
      - _syno.msg: "regex_extract($event.original, '^(?:<[0-9]{1,3}>)?1 [^ ]+ [^ ]+ [^ ]+ [^ ]+ [^ ]+ (?:-|(?:[[](?:[^]\"]|\"[^\"]*\")*[]])+) (.*)$')"
  - check: "regex_match($event.original, '^(<[0-9]{1,3}>)?1 ') AND regex_match($_syno.msg, '^Event:[ ]')"
    map:
      - event.provider: $_syno.cat
      - _syno.cat: file
      - message: $_syno.msg
  - check: "regex_match($event.original, '^(<[0-9]{1,3}>)?1 ') AND regex_match($_syno.msg, '^[^]:[:space:]]+:[[:space:]]+[^[:space:]]') AND NOT regex_match($_syno.msg, '^Event:[ ]')"
    map:
      - _syno.actor: "regex_extract($_syno.msg, '^([^]:[:space:]]+):[[:space:]]')"
      - message: "regex_extract($_syno.msg, '^[^]:[:space:]]+:[[:space:]]+(.*)$')"
  - check: "regex_match($event.original, '^(<[0-9]{1,3}>)?1 ') AND not_exists($message)"
    map:
      - message: $_syno.msg

  # DSM 6 calls Hyper Backup "Backup".
  - check: "$_syno.cat == 'Backup'"
    map:
      - _syno.cat: Hyper_Backup
  - check: "$_syno.cat != 'file'"
    map:
      - process.name: $_syno.cat
  - check: exists($event.provider)
    map:
      - process.name: $event.provider
  - check: exists($host.hostname)
    map:
      - related.hosts: array_append($host.hostname)
