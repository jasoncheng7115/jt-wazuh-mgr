<!--
  jt-pbs agent group: the Proxmox Backup Server logs outside syslog.
  /var/log/syslog (proxmox-backup-proxy and proxmox-backup-api messages) is
  already read by every Linux agent's own ossec.conf. The agent runs as root
  and can read these files although they belong to the backup user.
-->
<agent_config os="Linux">

  <!-- Logins and refused requests. A few lines a day. -->
  <localfile>
    <location>/var/log/proxmox-backup/api/auth.log</location>
    <log_format>syslog</log_format>
  </localfile>

  <!-- REST API requests. Only requests that change something are kept:
       GET and HEAD are about 240,000 lines a day on a server that backs up
       one cluster, and every backup ends with a log upload and a notes update.
       The result of a login is in auth.log. -->
  <localfile>
    <location>/var/log/proxmox-backup/api/access.log</location>
    <log_format>syslog</log_format>
    <ignore type="PCRE2">"(?:GET|HEAD) </ignore>
    <ignore type="PCRE2">"POST /api2/json/admin/datastore/[^/]+/upload-backup-log\?</ignore>
    <ignore type="PCRE2">"PUT /api2/json/admin/datastore/[^/]+/notes\?</ignore>
    <ignore type="PCRE2">"POST /api2/(?:json|extjs)/access/ticket"</ignore>
  </localfile>

  <!-- One line per finished task with its result. Successful backup and
       restore sessions are about 98 per cent of it. -->
  <localfile>
    <location>/var/log/proxmox-backup/tasks/archive</location>
    <log_format>syslog</log_format>
    <ignore type="PCRE2">:(?:backup|reader):[^: ]*:[^: ]+: [0-9A-F]{8,} OK$</ignore>
  </localfile>

</agent_config>
