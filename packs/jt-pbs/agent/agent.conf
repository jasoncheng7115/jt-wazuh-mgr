<!--
  jt-pbs agent group: the Proxmox Backup Server logs outside syslog.
  /var/log/syslog (proxmox-backup-proxy and proxmox-backup-api messages) is
  already read by every Linux agent's own ossec.conf. The agent runs as root
  and can read these files although they belong to the backup user.
-->
<agent_config os="Linux">

  <!-- Successful logins only. A failed login or a refused ticket or token is
       written to syslog as well (log::error! in proxmox-rest-server), and the
       pack reads failures from there, so each one is counted once by the
       brute-force rules and a server outside this group still reports them.
       A few lines a day. -->
  <localfile>
    <location>/var/log/proxmox-backup/api/auth.log</location>
    <log_format>syslog</log_format>
    <restrict type="PCRE2">: successful auth for user '</restrict>
  </localfile>

  <!-- REST API requests. Only requests that change something are kept:
       GET and HEAD are about 240,000 lines a day on a server that backs up
       one cluster, and every backup ends with a log upload and a notes update.
       Login ticket requests are kept: they are the only place a login's
       source address is written (a few a day). -->
  <localfile>
    <location>/var/log/proxmox-backup/api/access.log</location>
    <log_format>syslog</log_format>
    <ignore type="PCRE2">"(?:GET|HEAD) </ignore>
    <ignore type="PCRE2">"POST /api2/json/admin/datastore/[^/]+/upload-backup-log\?</ignore>
    <ignore type="PCRE2">"PUT /api2/json/admin/datastore/[^/]+/notes\?</ignore>
  </localfile>

  <!-- One line per finished task with its result. Successful backup and
       restore sessions are about 98 per cent of it. -->
  <localfile>
    <location>/var/log/proxmox-backup/tasks/archive</location>
    <log_format>syslog</log_format>
    <ignore type="PCRE2">:(?:backup|reader):[^: ]*:[^: ]+: [0-9A-F]{8,} OK$</ignore>
  </localfile>

  <!-- The configuration (rules 131895 to 131898). proxmox-backup-manager on
       the server's shell changes these files without a REST API request, so
       the access log never shows it. The default syscheck scans /etc every 12
       hours; this watches the directory in real time.
       restrict keeps the lock files (.lck, .lock) and the temporary file every
       write renames into place (name.tmp_XXXXXX) out, without a global ignore
       pattern that would apply to every path on the agent. restrict is
       OS_Match: a dot is a literal dot and only ^ $ | ! are special.
       report_changes only for the files without secrets: user.cfg, acl.cfg
       and the job files. shadow.json, token.shadow, tfa.json (TOTP secrets),
       domains.cfg (OpenID client keys), remote.cfg (remote passwords),
       s3.cfg, node.cfg, notifications-priv.cfg, the keys and certificates are
       checked by hash only, so no secret ends up in an alert.
       The subscription status is rewritten by the daily update: ignored. -->
  <syscheck>
    <directories check_all="yes" realtime="yes" restrict=".cfg$|.json$|.shadow$|.key$|.pem$|.pub$|.pfx$|/encryption-keys/|/acme/">/etc/proxmox-backup</directories>
    <directories check_all="yes" realtime="yes" report_changes="yes">/etc/proxmox-backup/user.cfg,/etc/proxmox-backup/acl.cfg,/etc/proxmox-backup/datastore.cfg,/etc/proxmox-backup/prune.cfg,/etc/proxmox-backup/verification.cfg,/etc/proxmox-backup/sync.cfg,/etc/proxmox-backup/notifications.cfg</directories>
    <ignore>/etc/proxmox-backup/subscription</ignore>
  </syscheck>

</agent_config>
