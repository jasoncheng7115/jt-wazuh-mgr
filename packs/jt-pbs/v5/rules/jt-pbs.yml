    selection:
      event.module: "proxmox-backup"
      event.action: "certificate-reloaded"
    enospc:
      message|contains: ["No space left on device", "os error 28"]
  tags: [jt.rule.131821, jt.pack.jt-pbs]

- metadata:
    title: "Proxmox Backup Server: out of disk space (No space left on device); backups to the datastore fail"
    author: Jason Tools
    description: "A Proxmox Backup Server daemon reports No space left on device (os error 28). Nothing is logged before the disk is full; the datastore usage rules (131892, 131893) warn earlier from df."
    references: ["Migrated from jt-pbs 4.x rule 131822"]
  sigma_id: jt-pbs-131822
  enabled: true
  status: experimental
  level: high
  logsource: {product: jt-pbs}
  detection:
    condition: selection and enospc
    selection:
      event.module: "proxmox-backup"
      event.dataset: "pbs.syslog"
    enospc:
      message|contains: ["No space left on device", "os error 28"]
  tags: [jt.rule.131822, jt.pack.jt-pbs]

- metadata:
    title: "Proxmox Backup Server: a scheduled job could not be started: {{error.message}}"
    author: Jason Tools
    description: "The task scheduler could not start a scheduled job; no task is created, so the task archive has nothing to report. A datastore that is not mounted or in maintenance is left out. 4.x reported it at most once an hour (ignore)."
    references: ["Migrated from jt-pbs 4.x rule 131827"]
  sigma_id: jt-pbs-131827
  enabled: true
  status: experimental
  level: high
  logsource: {product: jt-pbs}
  detection:
    condition: selection and not unavailable and not enospc
    selection:
      event.module: "proxmox-backup"
      event.action: "job-start-failed"
    unavailable:
      message|contains: ["is not mounted", "maintenance mode", "is being unmounted", "is being deleted"]
    enospc:
      message|contains: ["No space left on device", "os error 28"]
  tags: [jt.rule.131827, jt.pack.jt-pbs]

- metadata:
    title: "Proxmox Backup Server: the task scheduler failed, scheduled jobs do not run: {{error.message}}"
    author: Jason Tools
    description: "The scheduler loop itself failed: no scheduled job (GC, prune, sync, verify, tape) runs."
    references: ["Migrated from jt-pbs 4.x rule 131828"]
  sigma_id: jt-pbs-131828
  enabled: true
  status: experimental
  level: high
  logsource: {product: jt-pbs}
  detection:
    condition: selection and not enospc
    selection:
      event.module: "proxmox-backup"
      event.action: "task-scheduler-failed"
    enospc:
      message|contains: ["No space left on device", "os error 28"]
  tags: [jt.rule.131828, jt.pack.jt-pbs]

- metadata:
    title: "Proxmox Backup Server: the task scheduler cannot read a job configuration or schedule, the job is skipped: {{error.message}}"
    author: Jason Tools
