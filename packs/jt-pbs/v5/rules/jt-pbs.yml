      event.action: "notification-no-recipient-email"
    enospc:
      message|contains: ["No space left on device", "os error 28"]
  tags: [jt.rule.131817, jt.pack.jt-pbs]

- metadata:
    title: "Proxmox Backup Server: a daemon is reloading or shutting down (update, restart or certificate change)"
    author: Jason Tools
    description: "proxmox-backup-proxy or proxmox-backup-api got a reload or shutdown request."
    references: ["Migrated from jt-pbs 4.x rule 131820"]
  sigma_id: jt-pbs-131820
  enabled: true
  status: experimental
