    selection:
      event.dataset: "pbs.task"
      event.outcome: "failure"
      event.action: "backup"
    enospc:
      error.message|contains: ["No space left on device", "os error 28", "ENOSPC"]
  tags: [jt.rule.131835, jt.pack.jt-pbs]

- metadata:
    title: "Proxmox Backup Server: verification of {{service.target.name}} found damaged backups (corrupt or missing chunks)"
    author: Jason Tools
    description: "Verification found snapshots it could not verify; which chunk and which snapshot is in the task log."
    references: ["Migrated from jt-pbs 4.x rule 131837"]
  sigma_id: jt-pbs-131837
  enabled: true
  status: experimental
  level: high
  logsource: {product: jt-pbs}
  detection:
    condition: selection and damaged
    selection:
      event.dataset: "pbs.task"
      event.outcome: "failure"
      event.action: ["verify", "verify_group", "verify_snapshot", "verificationjob"]
    damaged:
      error.message|contains: "verification failed - please check the log for details"
  tags: [jt.rule.131837, jt.pack.jt-pbs]

