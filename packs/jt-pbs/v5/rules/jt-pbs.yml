- metadata:
    title: "Proxmox Backup Server API: job or tape configuration changed by {{user.name}} ({{http.request.method}} {{url.original}}) from {{source.ip}}"
    author: Jason Tools
    description: "Verification or tape jobs, media pools, drives, changers, traffic control or metrics servers changed."
    references: ["Migrated from jt-pbs 4.x rule 131873"]
  sigma_id: jt-pbs-131873
  enabled: true
  status: experimental
  level: informational
  logsource: {product: jt-pbs}
  detection:
    condition: selection and ok and not verifydelete
    selection:
