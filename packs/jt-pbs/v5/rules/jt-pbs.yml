# jt-pbs rules for Wazuh 5.x (Sigma, evaluated by the indexer; beta). Each carries the tag jt.rule.<id> of the
# 4.x rule it replaces. 4.x rules below level 3 and the level 0 bases are not ported (on 5.x every decoded
# event is indexed anyway). Sigma rules are independent (no if_sid): where a 4.x child rule replaced its
# parent, the parent here excludes the child's case, so an event gives one finding as before. The frequency
# and correlation rules (131805, 131806, 131809, 131812, 131819, 131823, 131836, 131866, 131877, 131880,
# 131881) are Alerting monitors (monitors/jt-pbs.yml). The detection fields are the WCS fields the pack's
# decoders fill (event.action names the kind of line; see the decoder comments). event.module or
# event.dataset in every selection keeps the rules off other integrations' events in the same index.
# Generated from a spec; levels: 4.x 3 -> informational, 4-6 -> low, 7-9 -> medium, 10-13 -> high.

- metadata:
    title: "Proxmox Backup Server: login of the administrator account {{user.name}}"
    author: Jason Tools
    description: "The built-in administrator (root@pam, or a root, admin or administrator account of another realm) logged in. The web interface renews its ticket every 15 minutes and each renewal is a login. The source address of the login is in the access log at the same second (131875)."
    references: ["Migrated from jt-pbs 4.x rule 131807"]
  sigma_id: jt-pbs-131807
  enabled: true
  status: experimental
  level: informational
  logsource: {product: jt-pbs}
  detection:
    condition: selection and admin
    selection:
      event.module: "proxmox-backup"
      event.action: "login"
    admin:
      user.name|startswith: ["root@", "admin@", "administrator@"]
  tags: [jt.rule.131807, jt.pack.jt-pbs]

- metadata:
    title: "Proxmox Backup Server: failed login for {{user.name}} from {{source.ip}}"
    author: Jason Tools
    description: "A wrong password (or a disabled or expired account) at the login. Read from syslog and from auth.log; the pbs agent group collects only successful logins from auth.log, so each failure arrives once."
    references: ["Migrated from jt-pbs 4.x rule 131802"]
  sigma_id: jt-pbs-131802
  enabled: true
  status: experimental
  level: low
  logsource: {product: jt-pbs}
  detection:
    condition: selection
    selection:
      event.module: "proxmox-backup"
      event.action: "login-failed"
  mitre:
    tactic: {"id": ["TA0006"], "name": ["Credential Access"]}
    technique: {"id": ["T1110"], "name": ["Brute Force"]}
  tags: [jt.rule.131802, jt.pack.jt-pbs]

- metadata:
    title: "Proxmox Backup Server: correct password but wrong second factor for {{user.name}} from {{source.ip}}"
    author: Jason Tools
    description: "The second login step is reached only after a correct password, so whoever is trying knows the password of the account. Repeated wrong TOTP codes lock TOTP after 8 tries (131825)."
    references: ["Migrated from jt-pbs 4.x rule 131824"]
  sigma_id: jt-pbs-131824
  enabled: true
  status: experimental
  level: medium
  logsource: {product: jt-pbs}
  detection:
    condition: selection
    selection:
      event.module: "proxmox-backup"
      event.action: "second-factor-failed"
  mitre:
    tactic: {"id": ["TA0001", "TA0006"], "name": ["Initial Access", "Credential Access"]}
    technique: {"id": ["T1078", "T1110"], "name": ["Valid Accounts", "Brute Force"]}
  tags: [jt.rule.131824, jt.pack.jt-pbs]

- metadata:
    title: "Proxmox Backup Server: request refused from {{source.ip}}: {{event.reason}} (an API token that is wrong, disabled or expired)"
    author: Jason Tools
    description: "A request without a user name refused for a reason other than a missing or expired ticket: almost always a Proxmox VE node whose stored API token no longer works, so its backups fail."
    references: ["Migrated from jt-pbs 4.x rule 131804"]
  sigma_id: jt-pbs-131804
  enabled: true
  status: experimental
  level: low
  logsource: {product: jt-pbs}
  detection:
    condition: selection
    selection:
      event.module: "proxmox-backup"
      event.action: "token-refused"
  tags: [jt.rule.131804, jt.pack.jt-pbs]

- metadata:
    title: "Proxmox Backup Server: the second factor of {{user.name}} is locked after repeated wrong codes"
    author: Jason Tools
    description: "TOTP locks after 8 wrong codes, every second factor for an hour after 100 failed tries. Someone who knows the password keeps trying; Proxmox Backup Server itself notifies no one."
    references: ["Migrated from jt-pbs 4.x rule 131825"]
  sigma_id: jt-pbs-131825
  enabled: true
  status: experimental
  level: high
  logsource: {product: jt-pbs}
  detection:
    condition: selection
    selection:
      event.module: "proxmox-backup"
      event.action: "second-factor-locked"
  mitre:
    tactic: {"id": ["TA0006", "TA0001"], "name": ["Credential Access", "Initial Access"]}
    technique: {"id": ["T1110", "T1078"], "name": ["Brute Force", "Valid Accounts"]}
  tags: [jt.rule.131825, jt.pack.jt-pbs]

- metadata:
    title: "Proxmox Backup Server: the datastore configuration lock could not be taken (usually while the services stop or restart)"
    author: Jason Tools
    description: "lookup_datastore could not take the datastore configuration lock; measured 8 a year, all while the services stopped for a reboot or an upgrade."
    references: ["Migrated from jt-pbs 4.x rule 131887"]
  sigma_id: jt-pbs-131887
  enabled: true
  status: experimental
  level: informational
  logsource: {product: jt-pbs}
  detection:
    condition: selection and not enospc
    selection:
      event.module: "proxmox-backup"
      event.action: "datastore-lock-failed"
    enospc:
      message|contains: ["No space left on device", "os error 28"]
  tags: [jt.rule.131887, jt.pack.jt-pbs]

- metadata:
    title: "Proxmox Backup Server: a datastore cannot be opened: {{error.message}}"
    author: Jason Tools
    description: "A datastore cannot be opened for a reason other than not mounted, maintenance or the configuration lock: its disk or chunk store is gone. 4.x reported it at most once an hour (ignore); 5.x reports every line."
    references: ["Migrated from jt-pbs 4.x rule 131814"]
  sigma_id: jt-pbs-131814
  enabled: true
  status: experimental
  level: high
  logsource: {product: jt-pbs}
  detection:
    condition: selection and not enospc
    selection:
      event.module: "proxmox-backup"
      event.action: "datastore-open-failed"
    enospc:
      message|contains: ["No space left on device", "os error 28"]
  tags: [jt.rule.131814, jt.pack.jt-pbs]

- metadata:
    title: "Proxmox Backup Server: a task failed: {{error.message}}"
    author: Jason Tools
    description: "Syslog copy of a failed task result; the task archive reports the same failure with the task type, the backup group and the user."
    references: ["Migrated from jt-pbs 4.x rule 131815"]
  sigma_id: jt-pbs-131815
  enabled: true
  status: experimental
  level: informational
  logsource: {product: jt-pbs}
  detection:
    condition: selection and not enospc and not protected
    selection:
      event.module: "proxmox-backup"
      event.action: "task-error"
    enospc:
      message|contains: ["No space left on device", "os error 28"]
    protected:
      message|contains: ["cannot remove protected snapshot", "only partially deleted due to protected snapshots"]
  tags: [jt.rule.131815, jt.pack.jt-pbs]

- metadata:
    title: "Proxmox Backup Server: a notification could not be delivered via {{service.target.name}}: {{error.message}}"
    author: Jason Tools
    description: "Job results and package update notices that could not be delivered; Proxmox Backup Server has no other way to tell anyone that a job failed."
    references: ["Migrated from jt-pbs 4.x rule 131816"]
  sigma_id: jt-pbs-131816
  enabled: true
  status: experimental
  level: medium
  logsource: {product: jt-pbs}
  detection:
    condition: selection and not enospc
    selection:
      event.module: "proxmox-backup"
      event.action: "notification-failed"
    enospc:
      message|contains: ["No space left on device", "os error 28"]
  tags: [jt.rule.131816, jt.pack.jt-pbs]

- metadata:
    title: "Proxmox Backup Server: a notification recipient has no e-mail address, nothing was sent to it"
    author: Jason Tools
    description: "A user named as a notification recipient has no e-mail address configured."
    references: ["Migrated from jt-pbs 4.x rule 131817"]
  sigma_id: jt-pbs-131817
