    condition: selection and not enospc
    selection:
      event.module: "proxmox-backup"
      event.action: "daemon-reload"
    enospc:
      message|contains: ["No space left on device", "os error 28"]
  tags: [jt.rule.131820, jt.pack.jt-pbs]

- metadata:
    title: "Proxmox Backup Server: the API certificate was replaced and reloaded"
    author: Jason Tools
    description: "The proxy reloads its certificate after a custom upload or an ACME order."
    references: ["Migrated from jt-pbs 4.x rule 131821"]
  sigma_id: jt-pbs-131821
  enabled: true
  status: experimental
  level: low
