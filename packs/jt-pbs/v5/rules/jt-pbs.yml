    title: "Proxmox Backup Server: backup of {{service.target.name}} by {{user.name}} failed: {{error.message}}"
    author: Jason Tools
    description: "A backup task failed. The same backup group failing three times a day is monitor 131836."
    references: ["Migrated from jt-pbs 4.x rule 131835"]
  sigma_id: jt-pbs-131835
  enabled: true
  status: experimental
  level: medium
