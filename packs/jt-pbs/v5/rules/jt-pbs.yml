      event.action: ["api-job-config", "api-verify-job"]
      http.request.method: ["POST", "PUT", "DELETE"]
    ok:
      http.response.status_code|gte: 200
      http.response.status_code|lt: 300
    verifydelete:
      event.action: "api-verify-job"
      http.request.method: "DELETE"
  tags: [jt.rule.131873, jt.pack.jt-pbs]

- metadata:
