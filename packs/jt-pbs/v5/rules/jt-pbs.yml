    selection:
      event.module: "proxmox-backup"
      event.action: "job-config-unreadable"
    enospc:
      message|contains: ["No space left on device", "os error 28"]
  tags: [jt.rule.131829, jt.pack.jt-pbs]

- metadata:
    title: "Proxmox Backup Server: a verification found corrupt or missing chunks; see the verification task log"
    author: Jason Tools
    description: "Since 3.3 the ERROR lines of a running verification reach syslog, before the task ends and without the agent group. A damaged datastore logs one line per chunk (4.x: at most once an hour)."
    references: ["Migrated from jt-pbs 4.x rule 131859"]
  sigma_id: jt-pbs-131859
  enabled: true
  status: experimental
  level: high
  logsource: {product: jt-pbs}
  detection:
    condition: selection and not enospc
    selection:
      event.module: "proxmox-backup"
      event.action: "verification-chunk-error"
    enospc:
      message|contains: ["No space left on device", "os error 28"]
  tags: [jt.rule.131859, jt.pack.jt-pbs]

- metadata:
    title: "Proxmox Backup Server: a request to delete protected backups was refused ({{http.request.method}} {{url.original}}, client {{source.ip}})"
    author: Jason Tools
    description: "Deleting protected snapshots was refused. Ransomware that reaches the backup server through a Proxmox VE node tries exactly this before it removes the protection (Pay2Key, 2025)."
    references: ["Migrated from jt-pbs 4.x rule 131886"]
  sigma_id: jt-pbs-131886
  enabled: true
  status: experimental
  level: high
  logsource: {product: jt-pbs}
  detection:
    condition: selection and protected and not enospc
    selection:
      event.module: "proxmox-backup"
      event.dataset: "pbs.syslog"
    protected:
      message|contains: ["cannot remove protected snapshot", "only partially deleted due to protected snapshots"]
    enospc:
      message|contains: ["No space left on device", "os error 28"]
  mitre:
    tactic: {"id": ["TA0040"], "name": ["Impact"]}
    technique: {"id": ["T1490"], "name": ["Inhibit System Recovery"]}
  tags: [jt.rule.131886, jt.pack.jt-pbs]

- metadata:
    title: "Proxmox Backup Server: task {{event.action}} {{service.target.name}} ended without a result (the service restarted while it ran?)"
    author: Jason Tools
    description: "A task in the archive with the result \"unknown\"."
    references: ["Migrated from jt-pbs 4.x rule 131833"]
  sigma_id: jt-pbs-131833
  enabled: true
  status: experimental
  level: low
  logsource: {product: jt-pbs}
  detection:
    condition: selection
    selection:
      event.dataset: "pbs.task"
      event.outcome: "unknown"
  tags: [jt.rule.131833, jt.pack.jt-pbs]

- metadata:
    title: "Proxmox Backup Server: task {{event.action}} {{service.target.name}} failed: {{error.message}}"
    author: Jason Tools
    description: "A failed task of a type without a rule of its own (label-media, a failed mount, a failed move, ...)."
    references: ["Migrated from jt-pbs 4.x rule 131834"]
  sigma_id: jt-pbs-131834
  enabled: true
  status: experimental
  level: low
  logsource: {product: jt-pbs}
  detection:
    condition: selection and not typed and not enospc
    selection:
      event.dataset: "pbs.task"
      event.outcome: "failure"
    typed:
      event.action: ["backup", "garbage_collection", "prune", "prunejob", "sync", "syncjob", "tape-backup", "tape-backup-job", "tape-restore", "reader", "acme-new-cert", "acme-renew-cert", "termproxy", "verify", "verify_group", "verify_snapshot", "verificationjob"]
    enospc:
      error.message|contains: ["No space left on device", "os error 28", "ENOSPC"]
  tags: [jt.rule.131834, jt.pack.jt-pbs]

