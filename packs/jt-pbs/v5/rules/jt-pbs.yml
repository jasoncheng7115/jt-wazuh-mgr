      http.request.method: "DELETE"
    ok:
      http.response.status_code|gte: 200
      http.response.status_code|lt: 300
  mitre:
    tactic: {"id": ["TA0005"], "name": ["Defense Evasion"]}
    technique: {"id": ["T1562"], "name": ["Impair Defenses"]}
    subtechnique: {"id": ["T1562.006"], "name": ["Indicator Blocking"]}
  tags: [jt.rule.131884, jt.pack.jt-pbs]

- metadata:
    title: "Proxmox Backup Server API: tape encryption keys changed by {{user.name}} ({{http.request.method}} {{url.original}}) from {{source.ip}}"
    author: Jason Tools
