# Optional site list: mount points of datastores that are neither under /mnt/datastore/ nor covered by
# the optional jt-pbs-datastores command (4.x CDB list etc/lists/jt-pbs-datastore-mounts). The key is
# the mount point exactly as df prints it; the value is free text. Ships with a placeholder only.
metadata:
  title: jt-pbs-datastore-mounts
  author: Jason Tools
  description: Mount points of Proxmox Backup Server datastores whose disk usage the pack should watch (optional).
enabled: true
content:
  /MOUNT-POINT-OF-A-DATASTORE: placeholder
