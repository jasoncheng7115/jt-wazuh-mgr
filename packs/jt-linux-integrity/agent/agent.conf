<agent_config>

  <!--
    jt-linux-integrity: real-time file integrity for the files the pack's
    rules read. Assign Linux hosts to the linux-integrity group. The rules
    match on the path, so a host outside the group still gets them for
    whatever its own FIM sees (by default the whole of /etc, scanned every
    12 hours, with no writer and no diff).

    whodata="yes" records which program wrote a file, which is what the
    rules use to tell "the package manager" or "passwd" from "an editor or a
    shell". It needs the audit userspace on the host (auditd and its
    libraries); without it the agent silently falls back to realtime and
    every change is reported as "writer not recorded" at a lower level.

    Every entry here is a FILE or a directory no other shipped group
    lists with different options. A path configured twice keeps only the
    LAST entry (measured on 4.14.7), so this group never lists /etc,
    /root/.ssh or another directory a site group may already monitor; file
    entries inside such a directory keep their own options.

    A monitored file that does not exist when the agent starts (for example
    /etc/ld.so.preload, /etc/doas.conf, a user's authorized_keys) is not
    watched in real time: its creation is seen when its parent directory is
    monitored in real time (the site's own /etc monitoring) or at the next
    scheduled scan. Wildcard paths (/home/*) are expanded again at each scan.

    report_changes keeps a copy of each file on the agent and puts the diff
    into the alert: what was added to sudoers, a crontab or a unit is the
    first thing an analyst needs, and the rules for a new UID 0 account,
    NOPASSWD: ALL and PAM bypass lines read it. It is ON for files that hold
    no secrets. It is never on for /etc/shadow, /etc/gshadow, their backups
    or /etc/security/opasswd: those diffs would carry password hashes into
    the manager's alerts and archives, so they are listed under nodiff as
    well (nodiff wins even if another group turns report_changes on for
    /etc). at job files hold the submitting user's whole environment, so
    they get no diff either. Cron lines and unit files can contain
    credentials typed into a command or an Environment= line: if yours do,
    set report_changes="no" on those two entries (the rules then work
    without the diff, except the diff-based ones).
  -->

  <syscheck>
    <!-- Account databases. passwd and group carry no hashes on any system
         with shadow passwords. -->
    <directories check_all="yes" realtime="yes" whodata="yes" report_changes="yes">/etc/passwd,/etc/group</directories>
    <directories check_all="yes" realtime="yes" whodata="yes" report_changes="no">/etc/shadow,/etc/gshadow</directories>

    <!-- sudo and doas -->
    <directories check_all="yes" realtime="yes" whodata="yes" report_changes="yes">/etc/sudoers,/etc/sudoers.d,/etc/sudo.conf,/etc/doas.conf</directories>

    <!-- Every cron and at location: system tables, the run-parts
         directories, who may use cron and at, and the per-user spools
         (/var/spool/cron holds crontabs/ and atjobs/ on Debian, the user
         files themselves on Red Hat; /var/spool/at is Red Hat's at). -->
    <directories check_all="yes" realtime="yes" whodata="yes" report_changes="yes">/etc/crontab,/etc/anacrontab,/etc/cron.allow,/etc/cron.deny,/etc/at.allow,/etc/at.deny</directories>
    <directories check_all="yes" realtime="yes" whodata="yes" report_changes="yes">/etc/cron.d,/etc/cron.hourly,/etc/cron.daily,/etc/cron.weekly,/etc/cron.monthly,/etc/cron.yearly</directories>
    <directories check_all="yes" realtime="yes" whodata="yes" report_changes="yes">/var/spool/cron,/var/spool/at</directories>

    <!-- systemd: administrator unit directories and generators. The vendor
         directories (/usr/lib/systemd) are left out on purpose: every
         package upgrade rewrites units there. -->
    <directories check_all="yes" realtime="yes" whodata="yes" report_changes="yes">/etc/systemd/system,/etc/systemd/user,/etc/systemd/system-generators,/etc/systemd/user-generators,/usr/local/lib/systemd</directories>
    <directories check_all="yes" realtime="yes" whodata="yes" report_changes="yes">/root/.config/systemd,/root/.local/share/systemd,/home/*/.config/systemd,/home/*/.local/share/systemd</directories>

    <!-- PAM: the stacks, module configuration, and the module directories
         (no diff for binaries). -->
    <directories check_all="yes" realtime="yes" whodata="yes" report_changes="yes">/etc/pam.d,/etc/pam.conf,/etc/security</directories>
    <directories check_all="yes" realtime="yes" whodata="yes">/usr/lib/security,/usr/lib64/security,/usr/lib/*-linux-gnu*/security,/lib/security,/lib64/security,/lib/*-linux-gnu*/security</directories>

    <!-- Dynamic linker -->
    <directories check_all="yes" realtime="yes" whodata="yes" report_changes="yes">/etc/ld.so.preload,/etc/ld.so.conf,/etc/ld.so.conf.d</directories>

    <!-- SSH keys: the files only, so a site's own /root/.ssh entry keeps
         its options. Public keys hold no secret. -->
    <directories check_all="yes" realtime="yes" whodata="yes" report_changes="yes">/root/.ssh/authorized_keys,/root/.ssh/authorized_keys2,/home/*/.ssh/authorized_keys,/home/*/.ssh/authorized_keys2</directories>

    <!-- Never a diff of a password hash or of an at job's environment. -->
    <nodiff>/etc/shadow</nodiff>
    <nodiff>/etc/gshadow</nodiff>
    <nodiff>/etc/shadow-</nodiff>
    <nodiff>/etc/gshadow-</nodiff>
    <nodiff>/etc/security/opasswd</nodiff>
    <nodiff type="sregex">^/etc/shadow|^/etc/gshadow|^/etc/security/opasswd|^/var/spool/cron/atjobs/|^/var/spool/cron/atspool/|^/var/spool/at/</nodiff>
  </syscheck>

</agent_config>
