<!--
  jt-odoo agent group: the Odoo server log, its configuration file and a
  configuration assessment.

  /var/log/odoo/odoo-server.log is where the Odoo deb package writes
  (logfile in /etc/odoo/odoo.conf). For a source install or a container
  with another logfile path, change the location below or add a localfile
  to that agent's own configuration. A file that does not exist is skipped.

  multi-line-regex joins a traceback to the record it belongs to: a new
  record starts with "YYYY-MM-DD HH:MM:SS,mmm PID ". The joined event keeps
  the exception type (AccessDenied, OperationalError, ...) for the rules.

  Dropped on the agent, before they cost anything on the manager:
    - static files, images, the service worker and the bus/websocket
      requests (56 per cent of the browser requests measured on one
      installation: every page load fetches dozens);
    - scheduled job start and end lines (several a minute): 16.0 "Starting
      job" / "Job `x` done.", 17.0 "Job done: `x` (0.1s).", 18.0 "Job 'x' (1)
      starting / done in / completed / processed", 19.0 "Job 'x' (1) fully
      done / partially done (#loop ...)". Failures and jobs started by hand
      stay;
    - deletions by the system user (user #1, scheduled jobs and garbage
      collection);
    - the 5-line deprecation WARNING 19.0 writes for every XML-RPC and
      JSON-RPC request (rule 132394 reports the use once a day from the
      request lines instead).
  Logins, database manager requests and every other request stay.

  /etc/odoo is watched in real time (Odoo rewrites odoo.conf when a master
  password is set through the database manager, and that change leaves no
  other trace). report_changes stays off: the file holds the master password
  and the database password, and a diff would copy them into alerts.

  The SCA policy jt-odoo-sca.yml travels with the group (the agent finds it
  in etc/shared). It only reads /etc/odoo/odoo.conf (no commands, so no
  remote command permission is needed) and is skipped on agents without
  that file.
-->
<agent_config os="Linux">

  <localfile>
    <location>/var/log/odoo/odoo-server.log</location>
    <log_format>multi-line-regex</log_format>
    <multiline_regex match="start" replace="wspace" timeout="3">^\d{4}-\d\d-\d\d \d\d:\d\d:\d\d,\d{3} \d+ </multiline_regex>
    <ignore type="PCRE2"> werkzeug: \S+ - - \[[^\]]+\] "GET /(?:web/(?:static|assets|image|webclient|service-worker\.js|manifest\.webmanifest|health)\b|[A-Za-z0-9_]+/static/|websocket|longpolling/|bus/|favicon\.ico)</ignore>
    <ignore type="PCRE2"> werkzeug: \S+ - - \[[^\]]+\] "POST /(?:longpolling/|bus/|websocket)</ignore>
    <ignore type="PCRE2"> INFO \S+ odoo\.addons\.base\.models\.ir_cron: (?:Job .+ \(\d+\) (?:starting|done in |completed|processed |done\s*$|(?:fully|partially) done \(#loop )|Starting job \x60|Job \x60.+\x60 done\.|Job done: \x60)</ignore>
    <ignore type="PCRE2"> INFO \S+ odoo\.models\.unlink: User #1 deleted </ignore>
    <ignore type="PCRE2"> WARNING \S+ odoo\.addons\.rpc\.controllers\.(?:xmlrpc|jsonrpc): The /xmlrpc, /xmlrpc/2 and /jsonrpc endpoints are deprecated </ignore>
  </localfile>

  <syscheck>
    <directories realtime="yes" check_all="yes" report_changes="no">/etc/odoo</directories>
  </syscheck>

  <sca>
    <policies>
      <policy>etc/shared/jt-odoo-sca.yml</policy>
    </policies>
  </sca>

</agent_config>
