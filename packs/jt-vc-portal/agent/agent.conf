<!--
  jt-vc-portal agent group: the portal's audit log, one JSON record per line.

  out_format puts "jt-vc-portal: " in front of every line. That is what the
  pack's decoder looks for: it is how the client address becomes srcip (for
  the active response) and how the first sign-in of an account from an
  address can be recognised, neither of which Wazuh's json decoder can do.
  log_format is syslog so the line is sent as it is. Lines collected without
  the prefix still match the pack's rules, without those two.

  The two locations are the documented defaults: the data volume of the
  docker run examples, and DATA_DIR of an installation without docker. A
  location that does not exist on a host is skipped. If the data directory is
  somewhere else, change the location here or add the same localfile, with
  the real path, to that agent's own ossec.conf. If the agent's ossec.conf
  already reads the file, remove that block: the log collector keeps only one
  definition of a duplicated file.

  The agent reads the file from the host, not from inside the container,
  and needs nothing from the portal: the file is mode 0640, owned by the web
  server user, and the agent's log collector runs as root.

  Only lines appended after the agent starts reading are sent, so the
  existing history (and any sample data in it) is not replayed. See the
  pack notes for the one exception: the portal's own retention clean-up.
-->
<agent_config os="Linux">

  <localfile>
    <location>/opt/jt-vc-portal/data/audit-log.jsonl</location>
    <log_format>syslog</log_format>
    <out_format>jt-vc-portal: $(log)</out_format>
  </localfile>

  <localfile>
    <location>/var/jaas-data/audit-log.jsonl</location>
    <log_format>syslog</log_format>
    <out_format>jt-vc-portal: $(log)</out_format>
  </localfile>

</agent_config>
