<!--
  jt-file-access - agent-side collection.

  Reading a file leaves no trace in file integrity monitoring; the operating system's audit
  does. This group only makes sure the agent reads that audit:

    Linux    /var/log/audit/audit.log, where the watches of jt-file-access.rules write.
             The watches themselves are set on the host (see the pack's setup steps): which
             folders are confidential is the site's decision, not this file's.

    Windows  nothing here on purpose. File access events (4663, 4656, 4907) come through the
             Security channel the agent already reads, and a second <localfile> for the same
             channel in a group is skipped as a duplicate by the agent. The Wazuh default
             agent configuration excludes 4656 and 4663 from that channel; the pack's setup
             steps show how to check and change it on the host.

  Cost: an audit record per open of a watched file. Watch the folders that hold confidential
  documents, not whole disks or home directories.
-->
<agent_config os="Linux">
  <localfile>
    <log_format>audit</log_format>
    <location>/var/log/audit/audit.log</location>
  </localfile>
</agent_config>
