# Optional tuning (4.x CDB list etc/lists/jt-zenarmor-domain-allow): exact names, in lower case, that
# the evasion-category rules and the tunnelling-service rule leave alone (a corporate VPN endpoint, a
# fixed tunnel name the site uses on purpose). It never silences malware or phishing.
# The shipped entries are placeholders that cannot exist (.invalid, and an .onion name that is not a
# valid onion address).
metadata:
  title: jt-zenarmor-domain-allow
  author: Jason Tools
  description: Names the evasion-category and tunnelling-service rules leave alone (exact, lower case).
enabled: true
content:
  allowlisted-domain.example.invalid: placeholder
  allowlisted-tunnel-placeholder.onion: placeholder
