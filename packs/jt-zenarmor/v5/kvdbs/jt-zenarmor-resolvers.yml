# IPv4 address, or a prefix ending in a dot (192.0.2. = 192.0.2.0/24, 192.0. = /16, 192. = /8).
# The shipped entry is a placeholder in the documentation range.
metadata:
  title: jt-zenarmor-resolvers
  author: Jason Tools
  description: Forwarding DNS servers whose lookups are counted as resolver lookups (address or prefix ending in a dot).
enabled: true
content:
