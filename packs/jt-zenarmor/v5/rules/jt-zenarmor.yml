# --- blocked lookups of command-and-control names (dns record) --------------------------------

- metadata:
    title: "Zenarmor: lookup of a command-and-control domain blocked - {{rule.category}} {{dns.question.name}} from {{source.ip}}"
    author: Jason Tools
    description: A client-style lookup (Recursion Desired, not PTR/NS/SOA, source not a listed resolver) of a command-and-control name was blocked. 4.x lowered this when the source had sent a resolver-style lookup in the 15 minutes before (130848); 5.x has no per-event correlation, so a recognised resolver's forwarded lookup raises this too.
    references: ["Migrated from jt-zenarmor 4.x rule 130819"]
  sigma_id: jt-zenarmor-130819
  enabled: true
  status: experimental
  level: low
  logsource: {product: jt-zenarmor}
  detection:
    condition: dns and blocked and threat and c2 and client and rd
    dns: {event.dataset: zenarmor.dns}
    blocked: {event.action: blocked}
    threat: {tags: zenarmor.st-malware}
    c2: {tags: zenarmor.st-c2}
    client: {tags: zenarmor.client-query}
    rd: {dns.header_flags: RD}
  mitre:
    tactic: {id: [TA0011], name: [Command and Control]}
    technique: {id: [T1071], name: [Application Layer Protocol]}
    subtechnique: {id: [T1071.004], name: [DNS]}
  tags: [jt.rule.130819, jt.pack.jt-zenarmor]

- metadata:
