# --- names that betray a tool -----------------------------------------------------------------
# Matched on destination.domain whatever Zenarmor's category is (suffix lists in the classification
# decoder, ideas of SigmaHQ net_dns_external_service_interaction_domains, net_dns_pua_cryptocoin_mining_xmr,
# zeek_dns_mining_pools, zeek_dns_torproxy and net_dns_mal_cobaltstrike, DRL 1.1).

- metadata:
    title: "Zenarmor: out-of-band testing domain resolved or contacted (not blocked), a host processed an injected payload: {{destination.domain}} ({{event.dataset}}) from {{source.ip}}"
    author: Jason Tools
    description: interactsh, Burp Collaborator, canarytokens and similar services hand out a unique name per payload; a lookup or session means some host processed an injected payload (log4j-style lookups, SSRF, a mail header) or opened a canary. A lookup through a resolver counts too.
    references: ["Migrated from jt-zenarmor 4.x rule 130841"]
  sigma_id: jt-zenarmor-130841
  enabled: true
  status: experimental
  level: high
  logsource: {product: jt-zenarmor}
  detection:
    condition: record and allowed and name and not stronger
    record: {event.dataset: [zenarmor.dns, zenarmor.tls, zenarmor.http]}
    allowed: {event.action: allowed}
    name: {tags: zenarmor.name-oast}
    stronger: {tags: [zenarmor.cat-malware, zenarmor.cat-phishing]}
  mitre:
    tactic: {id: [TA0001, TA0043], name: [Initial Access, Reconnaissance]}
    technique: {id: [T1190, T1595], name: [Exploit Public-Facing Application, Active Scanning]}
