# jt-zenarmor rules for Wazuh 5.x (Sigma, evaluated by the indexer; beta). Each one carries the tag
# jt.rule.<id> of the 4.x rule it replaces. 4.x rules below level 3 are not ported: on 5.x every
# decoded event is indexed anyway, and a rule only adds a finding. The frequency rules (130830 to
# 130835, 130860) are Alerting monitors (monitors/jt-zenarmor.yml).
#
# The decoders do the classification the 4.x rules did with case-insensitive pcre2 (Sigma here is
# case-sensitive and |re does not work on rc2): the rules match tags zenarmor.* (see
# decoders/20-jt-zenarmor-classify.yml). 4.x tried sibling rules in a fixed order (higher level
# first) and the first match won; Sigma rules are independent, so every rule below excludes the
# cases a 4.x rule tried before it, and an event gives one finding, as before.
#
# Levels: 4.x 3 -> informational, 4-6 -> low, 7-9 -> medium, 10-13 -> high.

# --- unblocked threats: the connection was established ----------------------------------------

- metadata:
    title: "Zenarmor: malicious connection was not blocked - {{rule.category}} from {{source.ip}} to {{destination.domain}} {{destination.ip}}"
    author: Jason Tools
    description: A connection whose security tags are malware, botnet, command and control, ransomware or similar was allowed and established. The DNS flow record of an unblocked lookup is left to the dns record.
    references: ["Migrated from jt-zenarmor 4.x rule 130801"]
  sigma_id: jt-zenarmor-130801
  enabled: true
  status: experimental
  level: high
  logsource: {product: jt-zenarmor}
  detection:
    condition: threat and allowed and not dns and not dnsflow
    threat: {tags: zenarmor.st-malware}
    allowed: {event.action: allowed}
    dns: {event.dataset: zenarmor.dns}
    dnsflow: {event.dataset: zenarmor.conn, destination.port: 53}
  mitre:
    tactic: {id: [TA0011], name: [Command and Control]}
    technique: {id: [T1071], name: [Application Layer Protocol]}
  tags: [jt.rule.130801, jt.pack.jt-zenarmor]

