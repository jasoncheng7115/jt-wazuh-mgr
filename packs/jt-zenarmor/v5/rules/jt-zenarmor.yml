    references: ["Migrated from jt-zenarmor 4.x rule 130805"]
  sigma_id: jt-zenarmor-130805
  enabled: true
  status: experimental
  level: low
  logsource: {product: jt-zenarmor}
  detection:
    condition: evasion and not blocked and not known and not toolname
    evasion: {tags: zenarmor.st-evasion}
    blocked: {event.action: blocked}
    known: {tags: [zenarmor.name-icloud-relay, zenarmor.name-tor-check, zenarmor.allowlisted]}
    toolname:
      event.dataset: [zenarmor.dns, zenarmor.tls, zenarmor.http]
      event.action: allowed
      tags: [zenarmor.name-oast, zenarmor.name-mining, zenarmor.name-stager]
  mitre:
