    tactic: {id: [TA0040], name: [Impact]}
    technique: {id: [T1496], name: [Resource Hijacking]}
  tags: [jt.rule.130866, jt.pack.jt-zenarmor]

- metadata:
    title: "Zenarmor: crypto-mining pool blocked, the host may still run a miner: {{destination.domain}} from {{source.ip}}"
    author: Jason Tools
    description: The alert record of a blocked connection or lookup to a crypto-mining pool; blocking the pool does not stop the miner.
    references: ["Migrated from jt-zenarmor 4.x rule 130874"]
  sigma_id: jt-zenarmor-130874
  enabled: true
  status: experimental
  level: high
  logsource: {product: jt-zenarmor}
  detection:
    condition: alert and blocked and family and name and (port53 or not c2 or not malware)
    alert: {event.dataset: zenarmor.alert}
    blocked: {event.action: blocked}
    family: {tags: [zenarmor.st-malware, zenarmor.st-phishing, zenarmor.st-potentially-dangerous, zenarmor.st-weak]}
    name: {tags: zenarmor.name-mining}
    c2: {tags: zenarmor.st-c2}
    malware: {tags: zenarmor.st-malware}
    port53: {destination.port: 53}
  mitre:
    tactic: {id: [TA0040], name: [Impact]}
    technique: {id: [T1496], name: [Resource Hijacking]}
  tags: [jt.rule.130874, jt.pack.jt-zenarmor]

- metadata:
    title: "Zenarmor: tunnelling service or Tor gateway resolved or contacted (not blocked): {{destination.domain}} ({{event.dataset}}) from {{source.ip}}"
    author: Jason Tools
    description: Reverse-tunnel services (Cloudflare quick tunnels, ngrok, localtunnel, serveo, pinggy, playit, portmap) and Tor web gateways or .onion names - an internal service published to the internet, malware or a phishing kit behind a quick tunnel, or Tor through a gateway. Developers use these too; a fixed name can go in jt-zenarmor-domain-allow.
    references: ["Migrated from jt-zenarmor 4.x rule 130868"]
  sigma_id: jt-zenarmor-130868
  enabled: true
  status: experimental
  level: low
  logsource: {product: jt-zenarmor}
  detection:
    condition: record and allowed and name and not allowlisted and not stronger and not stronger_tag and not toolname
    record: {event.dataset: [zenarmor.dns, zenarmor.tls, zenarmor.http]}
    allowed: {event.action: allowed}
    name: {tags: zenarmor.name-tunnel}
    allowlisted: {tags: zenarmor.allowlisted}
    stronger: {tags: [zenarmor.cat-malware, zenarmor.cat-phishing, zenarmor.cat-potentially-dangerous, zenarmor.cat-evasion]}
    stronger_tag: {tags: zenarmor.st-evasion}
    toolname: {tags: [zenarmor.name-oast, zenarmor.name-mining, zenarmor.name-stager]}
  mitre:
    tactic: {id: [TA0011], name: [Command and Control]}
    technique: {id: [T1572, T1090], name: [Protocol Tunneling, Proxy]}
    subtechnique: {id: [T1090.003], name: [Multi-hop Proxy]}
  tags: [jt.rule.130868, jt.pack.jt-zenarmor]

- metadata:
    title: "Zenarmor: lookup in the shape of Cobalt Strike's DNS stager, check the host: {{dns.question.name}} {{dns.question.type}} from {{source.ip}}"
    author: Jason Tools
    description: Cobalt Strike's default DNS stager names (aaa.stage.*, *.stage.123456.*); a changed profile does not use them.
    references: ["Migrated from jt-zenarmor 4.x rule 130870"]
  sigma_id: jt-zenarmor-130870
  enabled: true
  status: experimental
  level: high
  logsource: {product: jt-zenarmor}
  detection:
    condition: dns and allowed and name
    dns: {event.dataset: zenarmor.dns}
    allowed: {event.action: allowed}
    name: {tags: zenarmor.name-stager}
  mitre:
    tactic: {id: [TA0011], name: [Command and Control]}
    technique: {id: [T1071], name: [Application Layer Protocol]}
    subtechnique: {id: [T1071.004], name: [DNS]}
  tags: [jt.rule.130870, jt.pack.jt-zenarmor]
