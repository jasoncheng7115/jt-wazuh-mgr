    author: Jason Tools
    description: A client-style lookup of a command-and-control or DNS-tunnel name was answered; the controller is reachable. 4.x lowered this to level 4 when the source had sent a resolver-style lookup in the 15 minutes before (130865); 5.x has no per-event correlation.
    references: ["Migrated from jt-zenarmor 4.x rule 130864"]
  sigma_id: jt-zenarmor-130864
  enabled: true
  status: experimental
  level: medium
  logsource: {product: jt-zenarmor}
  detection:
    condition: dns and allowed and threat and c2 and client and rd and not toolname and not evasion
    dns: {event.dataset: zenarmor.dns}
    allowed: {event.action: allowed}
    threat: {tags: zenarmor.dns-threat}
    c2: {tags: zenarmor.dns-c2}
    client: {tags: zenarmor.client-query}
    rd: {dns.header_flags: RD}
    toolname: {tags: [zenarmor.name-oast, zenarmor.name-mining, zenarmor.name-tunnel, zenarmor.name-stager]}
    evasion: {tags: zenarmor.st-evasion}
  mitre:
    tactic: {id: [TA0011], name: [Command and Control]}
    technique: {id: [T1071], name: [Application Layer Protocol]}
    subtechnique: {id: [T1071.004], name: [DNS]}
  tags: [jt.rule.130864, jt.pack.jt-zenarmor]

