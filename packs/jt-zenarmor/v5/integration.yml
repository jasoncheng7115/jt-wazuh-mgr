# jt-zenarmor for Wazuh 5.x (beta): the integration that groups the pack's decoders, KVDBs and
# Sigma rules. metadata.title is the integration's name in the engine and the logsource.product
# of every rule. Zenarmor is a next-generation firewall: its records are network activity.
category: network-activity
enabled: true
metadata:
  title: jt-zenarmor
  author: Jason Tools
  description: >-
    Zenarmor NGFW records streamed from OPNsense by syslog: blocked and unblocked threats from
