<!--
  jt-nextcloud agent group: Nextcloud's own log and the admin_audit log.

  The paths are the defaults for Nextcloud installed in /var/www/nextcloud
  with log_type "file". If "occ config:system:get datadirectory" (or logfile,
  logfile_audit) says otherwise, change the two locations here. A file that
  does not exist on a host is skipped by the agent.

  out_format puts "jt-nextcloud: " in front of every line. That is what the
  pack's decoder looks for: it is how remoteAddr becomes srcip, which Wazuh's
  json decoder cannot do. log_format is syslog so the line is sent as it is.
  If the agent's own ossec.conf reads the same file as well, the logcollector
  warns "Log file ... is duplicated" and keeps one definition only (in a
  test on 4.14.7, the one read last): remove the old block from ossec.conf
  so that it is certain which one applies.
-->
<agent_config os="Linux">

  <!-- Debug lines (level 0) are dropped: an administrator who switches
       loglevel to 0 for a minute would otherwise send everything. -->
  <localfile>
    <location>/var/www/nextcloud/data/nextcloud.log</location>
    <log_format>syslog</log_format>
    <out_format>jt-nextcloud: $(log)</out_format>
    <ignore type="PCRE2">^\{"reqId":"[^"]*","level":0,</ignore>
  </localfile>

  <!-- The audit log writes one line for every file read, write, upload,
       copy, rename and preview, and one "Login attempt" before every login.
       No rule uses them and they are most of the file, so they stay on the
       host. Deletions, logins, shares, users, groups, apps and occ commands
       are sent. -->
  <localfile>
    <location>/var/www/nextcloud/data/audit.log</location>
    <log_format>syslog</log_format>
    <out_format>jt-nextcloud: $(log)</out_format>
    <ignore type="PCRE2">"message":"(?:Preview accessed: |Login attempt: |File with id \\"\d+\\" (?:accessed|written to|created): |File id copied from: |File renamed with id )</ignore>
  </localfile>

  <!-- User files in the data directory are not code. On one server they
       were 98,358 of the 200,000 entries the file integrity database may
       hold, which leaves no room for the paths that matter. The code
       (apps, lib, core, 3rdparty) is outside the data directory and stays
       monitored. -->
  <syscheck>
    <ignore type="sregex">^/var/www/nextcloud/data/</ignore>
  </syscheck>

</agent_config>
