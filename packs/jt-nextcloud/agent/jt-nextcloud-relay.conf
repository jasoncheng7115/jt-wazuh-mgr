# jt-nextcloud log relay for rsyslog (jt-nextcloud 1.2.5)
# Copyright Jason Tools Co., Ltd. / AGPL-3.0-or-later
#
# Install on the Nextcloud host as /etc/rsyslog.d/60-jt-nextcloud.conf, then
#   rsyslogd -N1 && systemctl restart rsyslog
#
# Why: every line of Nextcloud's audit log (and some lines of nextcloud.log)
# carries the object "data":{"app":...}. Wazuh decodes it into the alert as
# data.data, and the Wazuh alerts index template maps data.data as a keyword,
# so the indexer rejects every such alert ("failed to parse field [data.data]
# of type [keyword]"). The alerts stay in alerts.json and the mail, but never
# reach the Wazuh dashboard. Rather than change anything in Wazuh, this copies
# the two logs to /var/log/jt-nextcloud/ with that one key renamed to
# "context"; the pack's agent group reads the copies.
#
# The rename is a plain text replacement of ,"data":{ with ,"context":{ .
# Inside a JSON string a quote is always escaped (\"), so text in a log
# message cannot match it. Nothing else in the line changes.
#
# Paths: the defaults for Nextcloud in /var/www/nextcloud with log_type file.
# If "occ config:system:get datadirectory" (or logfile, logfile_audit) says
# otherwise, change the two file= paths below.
#
# imfile must be loaded once. Most hosts do not load it anywhere else: then
# remove the # in front of the module line. If another file in
# /etc/rsyslog.d loads it already, loading it twice is an error.
#module(load="imfile")

# Nextcloud writes lines of more than 8 KB (exceptions with a trace); rsyslog
# cuts lines at 8 KB by default, which would leave broken JSON.
global(maxMessageSize="256k")

template(name="jt_nextcloud_line" type="string" string="%$.jt_line%\n")

ruleset(name="jt_nextcloud_log") {
    set $.jt_line = replace($msg, ",\"data\":{", ",\"context\":{");
    action(type="omfile" file="/var/log/jt-nextcloud/nextcloud.log" template="jt_nextcloud_line"
           dirCreateMode="0750" fileCreateMode="0640" fileOwner="root" fileGroup="adm" dirGroup="adm")
    stop
}

ruleset(name="jt_nextcloud_audit") {
    set $.jt_line = replace($msg, ",\"data\":{", ",\"context\":{");
    action(type="omfile" file="/var/log/jt-nextcloud/audit.log" template="jt_nextcloud_line"
           dirCreateMode="0750" fileCreateMode="0640" fileOwner="root" fileGroup="adm" dirGroup="adm")
    stop
}

# The rulesets end with stop: these lines are not written to syslog and not
# forwarded anywhere else.
input(type="imfile" file="/var/www/nextcloud/data/nextcloud.log" tag="jt-nextcloud-log:"
      ruleset="jt_nextcloud_log" reopenOnTruncate="on")
input(type="imfile" file="/var/www/nextcloud/data/audit.log" tag="jt-nextcloud-audit:"
      ruleset="jt_nextcloud_audit" reopenOnTruncate="on")
