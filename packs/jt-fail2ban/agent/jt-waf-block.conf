# jt-waf-block: fail2ban action that blocks the address at the reverse proxy through jt-waf-mgr
# (jt-fail2ban pack). Install as /etc/fail2ban/action.d/jt-waf-block.conf and add it to a jail
# whose service sits behind the proxy, next to the local action:
#
#   [zimbra-webmail]
#   action = route
#            jt-waf-block
#
# The local action still covers direct connections; this one covers traffic through the proxy.
# Settings and the token live in /etc/jt-waf-block.conf and /etc/jt-waf-block.token (see
# /usr/local/sbin/jt-waf-block --help).

[Definition]
actionstart =
actionstop =
actioncheck =
actionban = /usr/local/sbin/jt-waf-block ban <ip> --source <source> --ttl <bantime> --reason "<name>: <failures> failures"
actionunban = /usr/local/sbin/jt-waf-block unban <ip> --source <source>

[Init]
source = <fq-hostname>/<name>
