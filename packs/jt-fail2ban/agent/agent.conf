<agent_config>

  <!--
    fail2ban log collection, installed by the jt-fail2ban pack.

    Manager-side rules cannot see a log the agent never reads. With its default
    logtarget fail2ban writes its own timestamped file rather than syslog, so
    without this entry the bans happen and nothing records them.

    This is a group of its own rather than part of a product group on purpose:
    fail2ban runs on mail servers, web servers, jump hosts and anything else
    facing the internet, and tying collection to one product leaves every other
    host running it invisible.

    Assign any agent running fail2ban to this group.

    Hosts whose logtarget is SYSLOG or SYSTEMD-JOURNAL need nothing here when the
    agent already reads /var/log/syslog or the journal (agents 4.9 and later
    read the journal by default). An agent that reads neither can take an entry
    like this one, limited to the fail2ban unit:

      <localfile>
        <log_format>journald</log_format>
        <location>journald</location>
        <filter field="_SYSTEMD_UNIT">^fail2ban.service$</filter>
      </localfile>

    The optional liveness check (a command entry) is NOT in this file: commands
    sent through a group need logcollector.remote_commands=1 on each agent. See
    the pack's setup guide.
  -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/fail2ban.log</location>
  </localfile>

</agent_config>
