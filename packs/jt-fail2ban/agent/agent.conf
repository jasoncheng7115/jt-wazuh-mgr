<agent_config>

  <!--
    fail2ban log collection, installed by the jt-fail2ban pack.

    Manager-side rules cannot see a log the agent never reads. fail2ban writes to
    its own timestamped file rather than to syslog, so without this entry the
    bans happen and nothing records them.

    This is a group of its own rather than part of a product group on purpose:
    fail2ban runs on mail servers, web servers, jump hosts and anything else
    facing the internet, and tying collection to one product leaves every other
    host running it invisible.

    Assign any agent running fail2ban to this group.
  -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/fail2ban.log</location>
  </localfile>

</agent_config>
