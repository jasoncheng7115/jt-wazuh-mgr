<!--
  jt-ipam agent group.
  jt-ipam's service messages are in the journal, which a Linux agent already
  reads (journald, or /var/log/syslog where rsyslog copies it). The audit
  trail is not: it lives in jt-ipam's database and is only sent out as GELF
  messages. The setup guide has rsyslog on the jt-ipam host receive them on
  127.0.0.1 and write each one as a syslog line with the program name
  jt-ipam-audit to the first file below. Set up the relay first and restart the
  agent afterwards, so the file exists when the agent opens its log files.

  From pack 1.2 the group also reads PostgreSQL's own log on the same host,
  for one thing above all: the database refusing a change to jt-ipam's
  append-only audit table. Only ERROR, FATAL and PANIC lines are sent
  (restrict below); the checkpoint and connection LOG lines, about 98 % of the
  file, and the DETAIL / STATEMENT continuation lines stay on the host, so SQL
  statements are not copied to the manager. The pattern expects the Debian and
  Ubuntu default log_line_prefix ('%m [%p] %q%u@%d ') and English messages
  (lc_messages C or en_US).
-->
<agent_config os="Linux">

  <localfile>
    <location>/var/log/jt-ipam-audit.log</location>
    <log_format>syslog</log_format>
  </localfile>

  <localfile>
    <location>/var/log/postgresql/postgresql-*-main.log</location>
    <log_format>syslog</log_format>
    <restrict type="PCRE2">^\d{4}-\d\d-\d\d \d\d:\d\d:\d\d(?:\.\d+)? \S+ \[\d+\] .*?\b(?:ERROR|FATAL|PANIC):  </restrict>
  </localfile>

</agent_config>
