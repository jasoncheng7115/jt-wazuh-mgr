# jt-modsecurity: exclusions for applications commonly put behind ModSecurity v3 + OWASP CRS 4.
#
# Each block below is a false positive met in production use, reduced to the narrowest change that
# fixes it: one application path, and either one rule, one argument, or "score but do not block".
# Include this file after crs-setup.conf and BEFORE the CRS rules (the same place as your own
# REQUEST-900 exclusions):
#
#     Include /etc/nginx/modsec/crs-setup.conf
#     Include /etc/nginx/modsec/jt-modsecurity-app-exclusions.conf
#     Include /etc/nginx/modsec/crs/rules/*.conf
#
# Every block is scoped by path only, because the pack cannot know your host names. If one host
# serves several applications, add a Host condition in front (see the commented example in the
# Zimbra section). Delete the blocks for applications you do not run.
# Rule IDs 13501-13599 belong to this file.

# --- Zimbra web client --------------------------------------------------------------------------

# The web client sends SOAP as JSON with Content-Type application/soap+xml. The XML body processor
# fails on every call (200002, "failed to parse request body"); parse them as JSON instead so the
# arguments are still inspected. BatchRequest is real XML from the same client and keeps the XML
# processor.
SecRule REQUEST_FILENAME "@rx ^/service/soap(?!/batchrequest)" \
    "id:13501,phase:1,pass,nolog,t:none,t:lowercase,chain"
    SecRule REQUEST_HEADERS:Content-Type "@contains soap+xml" "t:none,t:lowercase,ctl:requestBodyProcessor=JSON"

# Mail, appointment, task, signature, contact and filter bodies are HTML and free text written by
# people (<html><body><div style=, <!--, "(name)", domain names): CRS scores a normal draft over 30
# and the anomaly threshold refuses it ("SaveDraftRequest / CSFE_SVC_ERROR / HTTP 403" in the web
# client). On these write endpoints only, CRS keeps scoring and logging but does not block.
# To limit it to the mail host, put a Host rule in front, for example:
#   SecRule REQUEST_HEADERS:Host "@rx ^mail\.example\.com(?::[0-9]+)?$" "id:13502,phase:1,pass,nolog,t:none,t:lowercase,chain"
SecRule REQUEST_FILENAME "@rx ^/service/soap/(?:savedraft|sendmsg|createappointment|modifyappointment|createappointmentexception|sendinvitereply|counterappointment|createtask|modifytask|createtaskexception|createsignature|modifysignature|createcontact|modifycontact|modifyprefs|modifyoutofoffice|createnote|modifyfilterrules)request$" \
    "id:13503,phase:1,pass,nolog,t:none,t:lowercase,ctl:ruleEngine=DetectionOnly"

# The REST paths carry the account, /home/user@example.com/Contacts. Domain names whose suffix is an
# entry of CRS's restricted-file list (for example ".tools/") trip 930120/930130 on every contacts,
# calendar and briefcase request. Only the path of these two prefixes is left out.
SecRule REQUEST_FILENAME "@rx ^/(?:service/)?home/" \
    "id:13504,phase:1,pass,nolog,t:none,t:lowercase,ctl:ruleRemoveTargetById=930130;REQUEST_FILENAME,ctl:ruleRemoveTargetById=930120;REQUEST_FILENAME"

# --- Exchange ActiveSync (Z-Push, Zimbra, Exchange) ---------------------------------------------

# Phones post WBXML; CRS's default allowed content types do not include it (920420 on every sync).
# Only on the ActiveSync path. CRS fills in its default list (901162) only when the variable is
# still unset, so appending to an unset variable would leave just these two types: when
# crs-setup.conf does not set rule 900220, start from CRS's defaults.
SecRule REQUEST_FILENAME "@beginsWith /microsoft-server-activesync" \
    "id:13505,phase:1,pass,nolog,t:none,t:lowercase,chain"
    SecRule &TX:allowed_request_content_type "@eq 0" \
        "t:none,setvar:'tx.allowed_request_content_type=|application/x-www-form-urlencoded| |multipart/form-data| |text/xml| |application/xml| |application/soap+xml| |application/json| |application/vnd.ms-sync.wbxml| |application/vnd.ms-sync|'"
SecRule REQUEST_FILENAME "@beginsWith /microsoft-server-activesync" \
    "id:13512,phase:1,pass,nolog,t:none,t:lowercase,chain"
    SecRule TX:allowed_request_content_type "!@contains |application/vnd.ms-sync.wbxml|" \
        "t:none,setvar:'tx.allowed_request_content_type=%{tx.allowed_request_content_type} |application/vnd.ms-sync.wbxml| |application/vnd.ms-sync|'"

# --- Zulip --------------------------------------------------------------------------------------

# Message text is whatever people type (code, shell commands, stack traces). It is in ARGS:content
# and, again, in the raw REQUEST_BODY that the Java and protocol rules read. Every other parameter
# (type, to, topic) is still checked.
SecRule REQUEST_FILENAME "@rx ^/(?:api/v1|json)/messages(?:/[0-9]+)?$" \
    "id:13506,phase:1,pass,nolog,t:none,t:lowercase,ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:content,ctl:ruleRemoveTargetByTag=OWASP_CRS;REQUEST_BODY"
# The message list is polled with narrow=[...] JSON in the query string (920540, thousands a day).
SecRule REQUEST_FILENAME "@rx ^/(?:api/v1|json)/messages(?:/[0-9]+)?$" \
    "id:13507,phase:1,pass,nolog,t:none,t:lowercase,ctl:ruleRemoveTargetById=920540;ARGS:narrow,ctl:ruleRemoveTargetById=920540;REQUEST_URI"

# --- Nextcloud ----------------------------------------------------------------------------------

# Use CRS's own nextcloud-rule-exclusions plugin for the rest of Nextcloud, and keep WebDAV
# (/remote.php/dav, /public.php/dav) out of ModSecurity entirely: the connector reads the whole
# upload into memory.
# The Context Chat / task-processing ExApp polls this endpoint with a GET that carries a body
# (920170), several times a minute.
SecRule REQUEST_FILENAME "@streq /ocs/v2.php/taskprocessing/tasks_provider/next" \
    "id:13508,phase:1,pass,nolog,t:none,ctl:ruleRemoveById=920170"

# --- Keycloak -----------------------------------------------------------------------------------

# redirect_uri and post_logout_redirect_uri are the applications' own URLs; a domain whose suffix is
# on CRS's restricted-file list ("example.tools/") trips 930120 on every login and logout.
SecRule REQUEST_FILENAME "@rx ^/realms/[^/]+/protocol/openid-connect/(?:auth|logout|login-status-iframe\.html)" \
    "id:13509,phase:1,pass,nolog,t:none,t:lowercase,ctl:ruleRemoveTargetById=930120;ARGS:redirect_uri,ctl:ruleRemoveTargetById=930120;ARGS:post_logout_redirect_uri"

# --- Cloudflare Web Analytics -------------------------------------------------------------------

# Browsers on your own network (which reach the server without Cloudflare) post page timings,
# page addresses and CSS selectors to /cdn-cgi/rum ("widget-content" -> 932120, URLs -> 930120).
# The body is telemetry; the application behind does not serve this path.
SecRule REQUEST_FILENAME "@streq /cdn-cgi/rum" \
    "id:13510,phase:1,pass,nolog,t:none,ctl:requestBodyAccess=Off"

# --- MCP clients (Claude Code) ------------------------------------------------------------------

# Every call carries params._meta["claudecode/toolUseId"]; the parameter NAME contains ".claude",
# an entry of CRS's restricted-file list (930120). Only that argument name is left out.
SecRule REQUEST_FILENAME "@rx ^/mcp/?$" \
    "id:13511,phase:1,pass,nolog,t:none,t:lowercase,ctl:ruleRemoveTargetById=930120;ARGS_NAMES:json.params._meta.claudecode/toolUseId"
