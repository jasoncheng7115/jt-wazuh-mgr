<!--
  jt-modsecurity agent group: put the web servers that run ModSecurity here.

  1. The ModSecurity JSON audit log, with the prefix the pack's decoder needs
     (it is how the client address becomes srcip). If the host's own ossec.conf
     already reads this file, remove that block: the logcollector keeps one
     definition only.
  2. jt-crs-update.py and crs-signing-key.asc arrive in /var/ossec/etc/shared/
     with this group; install them as the pack's setup guide says. The updater
     logs to syslog, which the host must already send (most do, e.g. the
     /var/log/syslog or journald collection of a Linux group).
-->
<agent_config os="Linux">
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/modsecurity/modsec_audit.log</location>
    <out_format>jt-modsecurity: $(log)</out_format>
  </localfile>
</agent_config>
