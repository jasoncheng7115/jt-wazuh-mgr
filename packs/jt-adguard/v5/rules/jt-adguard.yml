- metadata:
    title: AdGuard Home refused local file {{file.path}} as a filter list, requested from {{source.ip}} (CVE-2024-36814 attempt)
    author: Jason Tools
    description: 'Before v0.107.52 an authenticated user could read any file as root by adding its path as a filter list. Fixed versions refuse paths outside safe_fs_patterns and log the attempt. On a vulnerable version the read succeeds without a trace: 130945.'
    references:
    - Migrated from jt-adguard 4.x rule 130947
  sigma_id: jt-adguard-130947
  enabled: true
  status: experimental
  level: high
  logsource:
    product: jt-adguard
  detection:
    condition: selection
    selection:
      event.module: adguard
      url.path|startswith: /control/filtering/
      error.message|contains: does not match safe patterns
  mitre:
    tactic:
      id:
      - TA0009
      - TA0007
      name:
      - Collection
      - Discovery
    technique:
      id:
      - T1005
      - T1083
      name:
      - Data from Local System
      - File and Directory Discovery
  tags:
  - jt.rule.130947
  - jt.pack.jt-adguard
  - cve.2024-36814

