# jt-adguard rules for Wazuh 5.x (beta; Sigma, evaluated by the indexer). Each one carries the tag
# jt.rule.<id> of the 4.x rule it replaces and sigma_id jt-adguard-<id>. Generated from one list, keep
# the style when editing by hand.
#
# Not ported as rules (see PORTING.md): 4.x levels below 3 (bases, repeats, probes; every decoded event
# is indexed anyway), the first-time-seen (fts) rules and the frequency rules, which are Alerting
# monitors in monitors/jt-adguard.yml, and 130975 (a 5.x rule cannot lower another rule's finding).
#
# Sigma rules are independent (no if_sid), so where 4.x let one sibling win over another (levels
# tried from high to low), the lower one here excludes the higher one's case: one finding per event.
# The list classes and the name classes the rules read (rule.category, tags jt-adguard.*) are set by
# the decoder with the 4.x regular expressions, because Sigma here has no case-insensitive or
# label-length matching. Write (internal or not ipv4), never not (ipv4 and not internal): the
# negated group compiled to a rule that never matched on rc2.
# Every rule also requires event.module adguard: the detector reads a whole
# category index, other integrations' events included.
# Levels: 4.x 3 -> informational, 4-6 -> low, 7-9 -> medium, 10-13 -> high.

- metadata:
    title: 'AdGuard: {{source.ip}} looked up {{dns.question.name}}, a domain on threat blocklist {{rule.ruleset}} (blocked)'
    author: Jason Tools
    description: A client looked up a domain listed by a threat blocklist (malware, phishing, badware, scam, C2, cryptomining). Every lookup is a finding; the first lookup of a domain by a client is the monitor 130913 (4.x first-time-seen, level 12).
    references:
    - Migrated from jt-adguard 4.x rule 130901
  sigma_id: jt-adguard-130901
  enabled: true
  status: experimental
  level: medium
  logsource:
    product: jt-adguard
  detection:
    condition: selection and not pattern
    selection:
      event.module: adguard
      event.action: blocked
      rule.category: threat
    pattern:
      tags: jt-adguard.pattern-rule
  mitre:
    tactic:
      id:
      - TA0011
      name:
      - Command and Control
    technique:
      id:
      - T1071
      name:
      - Application Layer Protocol
    subtechnique:
      id:
      - T1071.004
      name:
      - 'Application Layer Protocol: DNS'
  tags:
  - jt.rule.130901
  - jt.pack.jt-adguard

