- metadata:
    title: 'AdGuard Home program file changed: {{file.path}}, check who replaced it (CVE-2024-36586)'
    author: Jason Tools
    description: On some installs an unprivileged user can overwrite the AdGuardHome binary, which runs as root. The built-in updater changes it too (4.x lowered a change within 15 minutes of "starting update" to level 3, rule 130975; 5.x cannot, see the 130972 finding next to it). Reads the events of the standard wazuh-fim integration (detector.yml).
    references:
    - Migrated from jt-adguard 4.x rule 130974
