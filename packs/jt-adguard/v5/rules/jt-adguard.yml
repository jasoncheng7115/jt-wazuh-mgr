- metadata:
    title: 'AdGuard Home configuration changed: {{file.path}}'
    author: Jason Tools
    description: 'AdGuard Home does not log setting changes (filtering, upstreams, rewrites, users), so its configuration file is watched (agent group adguard). Do not enable report_changes on it: it holds the password hashes of the web users. Reads the events of the standard wazuh-fim integration (detector.yml).'
    references:
    - Migrated from jt-adguard 4.x rule 130940
  sigma_id: jt-adguard-130940
