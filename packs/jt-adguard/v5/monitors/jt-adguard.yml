# ---- web interface logins ---------------------------------------------------------------------------
- id: '130929'
  title: "AdGuard Home: repeated failed logins to the web interface from one address, password guessing"
  level: high
  source: findings
  match: {wazuh.rule.sigma_id: jt-adguard-130931}
  window: 5m
  group_by: [wazuh.agent.name, source.ip]
  count: 8

# 4.x: a success after three or more failures from the address within 10 minutes. A monitor here has
# one condition (count or distinct), so this is "failures and a success from one address within 10
# minutes" (at least one failure): looser than 4.x. See PORTING.md.
- id: '130939'
  title: "AdGuard Home: successful login to the web interface from an address that also failed to log in within 10 minutes"
  level: high
  source: findings
  match: {wazuh.rule.sigma_id: [jt-adguard-130931, jt-adguard-130941, jt-adguard-130942]}
  window: 10m
  group_by: [wazuh.agent.name, source.ip]
  distinct: {field: event.action, gte: 2}

- id: '130944'
  title: "AdGuard Home: successful login to the web interface from an address the login rate limiter had locked out"
  level: high
  source: findings
