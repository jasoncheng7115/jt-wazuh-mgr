# jt-adguard 4.x correlation rules as Alerting bucket-level monitors (Wazuh 5.x, beta).
# 5.0 rules have no frequency / same_source_ip / if_matched_sid / first-time-seen (fts); the documented
# replacement is a monitor that counts findings (or events) over a window and raises an alert per
# group. Format: see packs/jt-fail2ban/v5/monitors/jt-fail2ban.yml (tools/pack5_dev.py monitors).
#
# First time seen (4.x <if_fts />, keyed on client address and domain, kept forever on the node's
# disk) becomes "first in the window": a monitor that groups by agent, client and domain with
# count 1 over 24 hours. A bucket-level alert stays active while its bucket exists and is not raised
# again, so a pair alerts once, and again only after it has been quiet for a whole window. Expect one
# burst after installing (every active pair), then the new pairs, as with 4.x.
#
# Monitors over events instead of findings count lines the per-event rules do not raise (4.x level
# 0 or 2: bypass and other Security-list repeats, tunnels, Tor, Telegram, IP lookups, long labels).
# They select on the classes the decoder sets (rule.category, tags jt-adguard.*).

# ---- threat lists -------------------------------------------------------------------------------
- id: '130913'
  title: "AdGuard: first lookup of a threat-listed domain by a client (blocked)"
  level: high
  source: findings
  match: {wazuh.rule.sigma_id: jt-adguard-130901}
  window: 24h
  group_by: [wazuh.agent.name, source.ip, dns.question.name]
  count: 1

- id: '130914'
  title: "AdGuard: one client looked up three or more different threat-listed domains within 10 minutes, the host is likely compromised"
  level: high
  source: findings
  match: {wazuh.rule.sigma_id: jt-adguard-130901}
  window: 10m
  group_by: [wazuh.agent.name, source.ip]
  distinct: {field: dns.question.name, gte: 3}

- id: '130911'
  title: "AdGuard: one client repeatedly looked up threat-listed domains, the host may be compromised"
  level: high
  source: findings
  match: {wazuh.rule.sigma_id: jt-adguard-130901}
  window: 5m
  group_by: [wazuh.agent.name, source.ip]
  count: 5

