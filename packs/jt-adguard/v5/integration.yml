# jt-adguard for Wazuh 5.x (beta): the integration that groups the pack's decoders and Sigma rules.
# metadata.title is the integration's name in the engine and the logsource.product of every rule.
# Category network-activity: AdGuard Home's query log is DNS traffic attributed to the client.
category: network-activity
enabled: true
metadata:
  title: jt-adguard
  author: Jason Tools
  description: >-
    AdGuard Home query events (blocked and allowed DNS lookups with the real client address) and
    its service log (web interface logins, versions, filter-list abuse, configuration notices)
    (jt-wazuh-mgr pack jt-adguard, 5.x edition, beta).
  references:
    - https://github.com/jasoncheng7115/jt-wazuh-mgr
    - https://github.com/AdguardTeam/AdGuardHome
