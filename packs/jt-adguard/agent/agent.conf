<!--
  jt-adguard agent group: the AdGuard Home host

  AdGuard Home does not log setting changes, so its configuration file is
  watched. Rule 130940 names the change. Since 1.4 the AdGuardHome program
  file next to it is watched too (130974, CVE-2024-36586: on some installs an
  unprivileged user can replace the binary that runs as root); a change made
  by the built-in updater is graded down by 130975. Only the top level of the
  directory is watched (recursion_level 0) and only these two files
  (restrict): data/ holds the query log, which is rewritten every few seconds,
  and agh-backup/ the updater's copies.

  Do not add report_changes: the configuration file holds the password hashes
  of the web users, and a diff would put them into the alert.

  Paths: /opt/AdGuardHome is the official install script's location. A snap
  install keeps the file in /var/snap/adguard-home/current, the Docker image in
  the directory mounted at /opt/adguardhome/conf. Add the one that applies
  (for snap and Docker the program file is read-only and not worth watching).

  The service log (logins, start and stop, version) needs nothing here when
  AdGuard Home runs as a systemd service: the agent's default journald
  collection already reads it. If AdGuard Home writes to a file instead
  (log.file in AdGuardHome.yaml), add a localfile with log_format syslog for
  that file.
-->
<agent_config os="Linux">
  <syscheck>
    <directories realtime="yes" check_all="yes" recursion_level="0" restrict="AdGuardHome.yaml$|/AdGuardHome$">/opt/AdGuardHome</directories>
  </syscheck>
</agent_config>
