<!--
  jt-adguard agent group: the AdGuard Home host

  AdGuard Home does not log setting changes, so its configuration file is
  watched. Rule 130940 names the change. Only the top level of the directory is
  watched (recursion_level 0) and only the one file (restrict): data/ holds the
  query log, which is rewritten every few seconds.

  Do not add report_changes: the file holds the password hashes of the web
  users, and a diff would put them into the alert.

  Paths: /opt/AdGuardHome is the official install script's location. A snap
  install keeps the file in /var/snap/adguard-home/current, the Docker image in
  the directory mounted at /opt/adguardhome/conf. Add the one that applies.

  The service log (logins, start and stop) needs nothing here when AdGuard Home
  runs as a systemd service: the agent's default journald collection already
  reads it. If AdGuard Home writes to a file instead (log.file in
  AdGuardHome.yaml), add a localfile with log_format syslog for that file.
-->
<agent_config os="Linux">
  <syscheck>
    <directories realtime="yes" check_all="yes" recursion_level="0" restrict="AdGuardHome.yaml$">/opt/AdGuardHome</directories>
  </syscheck>
</agent_config>
