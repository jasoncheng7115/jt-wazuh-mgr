# jt-proxmox for Wazuh 5.x (beta): the integration that groups the pack's decoders and Sigma rules.
# metadata.title is the integration's name in the engine and the logsource.product of every rule.
# Category system-activity: the pack's events land in wazuh-events-v5-system-activity, the same
# index as the standard wazuh-fim events its /etc/pve file integrity rules read (see detector.yml).
category: system-activity
enabled: true
metadata:
  title: jt-proxmox
  author: Jason Tools
  description: >-
    Proxmox VE and Ceph: tasks, logins and second factors, high availability, cluster quorum,
    Ceph health, REST API changes (pveproxy access log) and file integrity of /etc/pve
    (jt-wazuh-mgr pack jt-proxmox, 5.x edition, beta).
  references:
    - https://github.com/jasoncheng7115/jt-wazuh-mgr
