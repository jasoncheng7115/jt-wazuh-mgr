# Snippets (the agent group watches /var/lib/vz/snippets; network storages mount under /mnt/pve).
# 4.x took added and modified files only; the 5.x FIM event type is not known here, so a deleted
# snippet gives a finding too.
- metadata:
    title: "Proxmox VE: snippet {{file.path}} added or changed (hookscripts and cloud-init files run from here)"
    author: Jason Tools
    description: Hookscripts and cloud-init user data must live in a snippets directory and run as root on the host or inside the guest.
    references: ["Migrated from jt-proxmox 4.x rule 131293"]
  sigma_id: jt-proxmox-131293
  enabled: true
  status: experimental
  level: low
  logsource: {product: jt-proxmox}
  detection:
    condition: fim and (local or (pve_mount and snippets))
    fim:
      wazuh.integration.name: wazuh-fim
    local:
      file.path|startswith: /var/lib/vz/snippets/
    pve_mount:
      file.path|startswith: /mnt/pve/
    snippets:
      file.path|contains: /snippets/
  mitre:
    tactic: {id: [TA0003], name: [Persistence]}
    technique: {id: [T1546], name: [Event Triggered Execution]}
  tags: [jt.rule.131293, jt.pack.jt-proxmox]
