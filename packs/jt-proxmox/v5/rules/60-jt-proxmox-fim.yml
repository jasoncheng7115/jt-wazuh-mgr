# --- file integrity of /etc/pve and the snippets directories -------------------------------------
# These read the events of Wazuh's standard wazuh-fim integration (wazuh-events-v5-system-activity,
# listed in detector.yml), not this pack's decoders. NOT VERIFIED on 5.0.0-rc2: no sample of a
# 5.x agent's stateless FIM event was available to replay (see PORTING.md). They rely on file.path
# and, for "content changed", on event.changed_fields (WCS: "fields that were updated since last
# scan"): an event whose changed fields exist but name none of size / md5 / sha1 / sha256 (pmxcfs
# renumbering an inode or touching mtime) gives no finding; an event without the field (added,
# deleted, or a field naming that differs) still does, so a wrong guess fails loud, not silent.
# 4.x 131290-131292 (pmxcfs churn, levels 0-2) only lowered the built-in rule 550; 5.x standard
# rules cannot be lowered by a pack, so they are not ported.

- metadata:
    title: "Proxmox VE: {{file.path}} changed (API token secrets, the cluster-wide root SSH keys or the cluster CA)"
    author: Jason Tools
    description: The API token secrets, the root SSH keys that every cluster node trusts, or the cluster CA changed.
    references: ["Migrated from jt-proxmox 4.x rule 131294"]
  sigma_id: jt-proxmox-131294
  enabled: true
  status: experimental
  level: high
  logsource: {product: jt-proxmox}
  detection:
    condition: selection and (content or not listed)
    selection:
      wazuh.integration.name: wazuh-fim
      file.path: [/etc/pve/priv/token.cfg, /etc/pve/priv/authorized_keys, /etc/pve/priv/pve-root-ca.key, /etc/pve/pve-root-ca.pem]
    content:
      event.changed_fields|contains: [size, md5, sha1, sha256]
    listed:
      event.changed_fields|exists: true
  mitre:
    tactic: {id: [TA0003], name: [Persistence]}
    technique: {id: [T1098], name: [Account Manipulation]}
    subtechnique: {id: [T1098.001, T1098.004], name: [Additional Cloud Credentials, SSH Authorized Keys]}
  tags: [jt.rule.131294, jt.pack.jt-proxmox]

