- metadata:
    title: "Proxmox VE: datacenter or node firewall configuration changed ({{file.path}})"
    author: Jason Tools
    description: The datacenter firewall (cluster.fw) or a node's host firewall (host.fw) changed. Guest firewalls are not included.
    references: ["Migrated from jt-proxmox 4.x rule 131298"]
  sigma_id: jt-proxmox-131298
  enabled: true
  status: experimental
  level: low
  logsource: {product: jt-proxmox}
  detection:
    condition: fim and (cluster_fw or (node_dir and host_fw)) and (content or not listed)
    fim:
      wazuh.integration.name: wazuh-fim
    cluster_fw:
      file.path: /etc/pve/firewall/cluster.fw
    node_dir:
      file.path|startswith: /etc/pve/nodes/
    host_fw:
      file.path|endswith: /host.fw
    content:
      event.changed_fields|contains: [size, md5, sha1, sha256]
    listed:
      event.changed_fields|exists: true
  mitre:
    tactic: {id: [TA0005], name: [Defense Evasion]}
    technique: {id: [T1562], name: [Impair Defenses]}
    subtechnique: {id: [T1562.004], name: [Disable or Modify System Firewall]}
  tags: [jt.rule.131298, jt.pack.jt-proxmox]

