# --- Ceph health (cluster log on monitor nodes) --------------------------------------------------
# Only the start of a check alerts; the ten-minute repeats ("overall HEALTH_WARN", "Health detail",
# clock checks) stay without a finding (4.x 131256, level 2). Every monitor node writes the whole
# cluster log, so an event arrives once per monitor node.

- metadata:
    title: "Ceph health warning: {{message}}"
    author: Jason Tools
    description: A Ceph health check started at warning level.
    references: ["Migrated from jt-proxmox 4.x rule 131251"]
  sigma_id: jt-proxmox-131251
  enabled: true
  status: experimental
  level: medium
  logsource: {product: jt-proxmox}
  detection:
    condition: selection and not 1 of serious_*
    selection:
      event.dataset: ceph.cluster
      event.action: health-check-failed
      log.level: warning
    serious_down:
      event.code: [OSD_DOWN, OSD_HOST_DOWN, MON_DOWN, MGR_DOWN, PG_AVAILABILITY, PG_DEGRADED_FULL, OSD_NEARFULL, POOL_NEARFULL]
    serious_full:
      event.code: [OSD_FULL, POOL_FULL, OSD_TOO_MANY_REPAIRS, PG_DAMAGED, OSD_SCRUB_ERRORS]
  tags: [jt.rule.131251, jt.pack.jt-proxmox]

