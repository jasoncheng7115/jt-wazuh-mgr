<!--
  jt-proxmox agent group: the logs a Proxmox node writes outside syslog.
  /var/log/syslog is already read by every Linux agent's own ossec.conf.
  A file that does not exist on a node (Ceph on a node without a monitor) is
  skipped by the agent.
-->
<agent_config os="Linux">

  <!-- REST API access. Only requests that change something, and failed logins,
       are kept: GET and HEAD are about 240,000 lines a day on a busy node, and a
       monitoring system adds a successful login ticket request every few seconds.
       The out_format header gives the lines the program name jt-pveproxy, so the
       pack's decoder reads them and can report the client's IPv4 address without
       the ::ffff: prefix (an active response cannot block it otherwise). -->
  <localfile>
    <location>/var/log/pveproxy/access.log</location>
    <log_format>syslog</log_format>
    <out_format>$(timestamp) $(hostname) jt-pveproxy: $(log)</out_format>
    <ignore type="PCRE2">"(?:GET|HEAD) </ignore>
    <ignore type="PCRE2">"POST /api2/(?:json|extjs)/access/ticket HTTP/1\.1" 200 </ignore>
  </localfile>

  <!-- Ceph cluster log on monitor nodes. [DBG] is about 99 per cent of it. -->
  <localfile>
    <location>/var/log/ceph/ceph.log</location>
    <log_format>syslog</log_format>
    <ignore type="PCRE2">: cluster \[DBG\] </ignore>
    <ignore type="PCRE2">: cluster \[INF\] overall HEALTH_OK$</ignore>
  </localfile>


</agent_config>
