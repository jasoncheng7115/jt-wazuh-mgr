<!--
  jt-proxmox agent group: the logs a Proxmox node writes outside syslog.
  /var/log/syslog is already read by every Linux agent's own ossec.conf, and
  /etc (with /etc/pve) is in every Linux agent's default file integrity list.
  A file that does not exist on a node (Ceph on a node without a monitor) is
  skipped by the agent.
-->
<agent_config os="Linux">

  <!-- REST API access. Only requests that change something, and logins that
       failed or came from a public address, are kept: GET and HEAD are about
       240,000 lines a day on a busy node, and a monitoring system adds a
       successful login ticket request every few seconds. Private sources
       dropped here: 10/8, 172.16/12, 192.168/16, 127/8, 100.64/10, fc00::/7,
       fe80::/10 and ::1, with or without the ::ffff: prefix.
       The out_format header gives the lines the program name jt-pveproxy, so the
       pack's decoder reads them and can report the client's IPv4 address without
       the ::ffff: prefix (an active response cannot block it otherwise). -->
  <localfile>
    <location>/var/log/pveproxy/access.log</location>
    <log_format>syslog</log_format>
    <out_format>$(timestamp) $(hostname) jt-pveproxy: $(log)</out_format>
    <ignore type="PCRE2">"(?:GET|HEAD) </ignore>
    <ignore type="PCRE2">^(?:(?:::ffff:)?(?:10|127|192\.168|172\.(?:1[6-9]|2\d|3[01])|100\.(?:6[4-9]|[7-9]\d|1[01]\d|12[0-7]))\.\S*|f[cd][0-9a-fA-F]*:\S*|fe[89abAB][0-9a-fA-F]*:\S*|::1) \S+ \S+ \[[^\]]*\] "POST /api2/(?:json|extjs)/access/ticket HTTP/1\.1" 200 </ignore>
  </localfile>

  <!-- Ceph cluster log on monitor nodes. [DBG] is about 99 per cent of it. -->
  <localfile>
    <location>/var/log/ceph/ceph.log</location>
    <log_format>syslog</log_format>
    <ignore type="PCRE2">: cluster \[DBG\] </ignore>
    <ignore type="PCRE2">: cluster \[INF\] overall HEALTH_OK$</ignore>
  </localfile>

  <!-- Snippets of the default local storage: hookscripts and cloud-init files
       must live in a snippets directory, and run as root on the host or in the
       guest. A few files, so real time costs nothing. -->
  <syscheck>
    <directories check_all="yes" realtime="yes">/var/lib/vz/snippets</directories>
    <!-- HA state files that pmxcfs rewrites every ten seconds (a FIM event
         each, and a write to the FIM database). lrm_status lives under
         /etc/pve/nodes/NODE/ and syscheck patterns have no wildcard, so it is
         not anchored; its .tmp.N siblings match too. -->
    <ignore type="sregex">lrm_status|^/etc/pve/ha/manager_status|^/etc/pve/ha/crm_commands</ignore>
  </syscheck>

</agent_config>
