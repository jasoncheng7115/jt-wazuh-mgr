<agent_config>

  <!--
    jt-jitsi: logs of a self-hosted Jitsi Meet server and of Jibri hosts.

    docker-jitsi-meet writes every component (Prosody, Jicofo, the
    videobridge, Jibri, the web container's nginx) to container stdout. With
    the default json-file logging driver Docker keeps that in one JSON file
    per container; the manager decodes the lines with the built-in json
    decoder and the jt-jitsi rules read their "log" field. Only new lines are
    read. A host with the journald logging driver has no such files: its
    lines reach the agent through /var/log/syslog or journald instead (see
    the pack's setup guide), and this entry finds nothing.
    Note: the wildcard covers every container on the host.
  -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/lib/docker/containers/*/*-json.log</location>
  </localfile>

  <!--
    The web server in front of Jitsi on the host. It is the only log that
    holds the real client address. Redact the jwt and token query parameters
    in its log format first (setup guide): the Jitsi client puts the JWT in
    the URL of the page, of /http-bind and of /xmpp-websocket.
  -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/nginx/access.log</location>
  </localfile>

</agent_config>
