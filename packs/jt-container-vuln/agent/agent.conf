<!--
  jt-container-vuln agent group: collect the container image scanner's
  results and watch the scanner itself.

  1. The scanner (jt-container-vuln.py, installed on each host by
     jt-container-vuln-install.sh, both delivered by this group) writes one
     JSON line per scanned image and one per run to
     /var/log/jt-container-vuln.json, once a day. Read as JSON; rules
     132800-132828. A few kilobytes a day per host.
     Nothing in this group runs a command: a <wodle name="command"> in a
     group's agent.conf runs only with wazuh_command.remote_commands=1 on the
     agent, which would let whoever controls the manager's group files run
     commands as root there. The scanner runs from a systemd timer that the
     host's administrator installs.

  2. File integrity of the installed scanner, in real time: the script
     directory and its configuration directory (rules 132840-132842). The
     systemd units and the timer's enable link are under /etc, which the
     default agent configuration already scans every 12 hours; a deleted
     timer or a "systemctl disable" is reported at that scan. No diffs are
     kept: the configuration may hold a proxy URL with a password.
-->
<agent_config os="Linux">

  <localfile>
    <log_format>json</log_format>
    <location>/var/log/jt-container-vuln.json</location>
  </localfile>

  <syscheck>
    <directories realtime="yes" check_all="yes">/usr/local/lib/jt-container-vuln</directories>
    <directories realtime="yes" check_all="yes">/etc/jt-container-vuln</directories>
  </syscheck>

</agent_config>
