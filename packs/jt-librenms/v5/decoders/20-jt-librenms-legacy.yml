# The unknown-user login line as LibreNMS before 25.1 wrote librenms.log (config/logging.php and
# app/Logging/NoColorFormatter.php of each tag):
#   23.6 to 24.12  Auth Error (mysql): No user () [admin] from 192.0.2.10        (no time, no level)
#   up to 23.5     [2023-05-02T10:15:02+00:00] production.ERROR: Auth Error (ldap): No user (-1) [bob] from 192.0.2.11
# Only this line is taken in these shapes: it is LibreNMS's own wording, while the generic
# "production.ERROR:" shape is every Laravel application's and a bare line has no level to grade.
name: decoder/jt-librenms-legacy/0
enabled: true
metadata:
  title: LibreNMS application log before 25.1 (unknown-user logins)
  author: Jason Tools
  description: The unknown-user login line of librenms.log as LibreNMS 23.x and 24.x wrote it.
  references:
    - https://github.com/librenms/librenms/blob/24.12.0/app/Logging/NoColorFormatter.php
parents:
  - decoder/jt-core/0
check: "regex_match($event.original, '^([[][0-9]{4}-[0-9]{2}-[0-9]{2}[T ][^]]*[]] [A-Za-z0-9_]+[.]ERROR: )?Auth Error [(][^)]*[)]: No user [(]')"
normalize:
  - map:
      - event.kind: event
      - event.module: librenms
      - event.dataset: librenms.log
      - service.type: librenms
      - message: "regex_extract($event.original, '(Auth Error [(].*?) *$')"
  - check: "regex_match($event.original, '^[[][^]]+[]] [A-Za-z0-9_]+[.]ERROR: ')"
    map:
      - log.level: error
