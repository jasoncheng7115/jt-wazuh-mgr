- metadata:
    title: "LibreNMS: the path of a program LibreNMS runs was changed ({{http.request.method}} {{url.original}}) from {{source.ip}}, the first step of known command execution exploits"
    author: Jason Tools
    description: >-
      Pointing a program path setting at a command or an uploaded file is how CVE-2024-51092,
      CVE-2026-6204 and CVE-2026-84190 turn an administrator session into command execution (the
      Metasploit module sends PUT /settings/snmpget, then GET /about, which runs it). Paths are set
      once at installation; a later change is rare. The 4.x follow-up rule 131976 (GET /about from
      the same address right after) has no 5.0 equivalent.
    references: ["Migrated from jt-librenms 4.x rule 131975", "https://github.com/advisories/GHSA-x645-6pf9-xwxw"]
  sigma_id: jt-librenms-131975
  enabled: true
  status: experimental
  level: high
  logsource: {product: jt-librenms}
  detection:
    condition: selection and program and not query
    selection:
      http.request.method: [PUT, DELETE]
      http.response.status_code: *ok2xx
    program: *program_settings
    query: {url.query|exists: true}
  mitre:
    tactic: {id: [TA0002, TA0001], name: [Execution, Initial Access]}
    technique: {id: [T1059, T1190], name: [Command and Scripting Interpreter, Exploit Public-Facing Application]}
    subtechnique: {id: [T1059.004], name: [Unix Shell]}
  tags: [jt.rule.131975, jt.pack.jt-librenms]

