- metadata:
    title: "LibreNMS: global setting changed or reset ({{url.original}}) from {{source.ip}}"
    author: Jason Tools
    description: A global LibreNMS setting was changed or reset to its default (authentication settings and program paths have rules of their own).
    references: ["Migrated from jt-librenms 4.x rule 131969"]
  sigma_id: jt-librenms-131969
  enabled: true
  status: experimental
  level: low
  logsource: {product: jt-librenms}
  detection:
    condition: selection and one and not deeper and not query and not program and (not auth or authlog)
    selection:
      http.request.method: [PUT, DELETE]
      http.response.status_code: *ok2xx
    one: {url.path: '/settings/?*'}
    deeper: {url.path: '/settings/*/*'}
    query: {url.query|exists: true}
    auth: &auth_settings
      url.path|startswith: ['/settings/auth', '/settings/sso.', '/settings/http_auth', '/settings/twofactor', '/settings/allow_unauth', '/settings/public_status', '/settings/api.']
    authlog: &authlog
      url.path|startswith: /settings/authlog_
    program: &program_settings
      url.path:
        - /settings/snmpget
        - /settings/snmpgetnext
        - /settings/snmpwalk
        - /settings/snmpbulkwalk
        - /settings/snmptranslate
        - /settings/snmptrap
        - /settings/fping
        - /settings/fping6
        - /settings/rrdtool
        - /settings/ipmitool
        - /settings/nfdump
        - /settings/traceroute
        - /settings/virsh
        - /settings/email_sendmail_path
        - /settings/nagios_plugins
  tags: [jt.rule.131969, jt.pack.jt-librenms]

