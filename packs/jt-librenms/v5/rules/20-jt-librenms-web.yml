# --- exploit indicators in the request line -------------------------------------------------------

- metadata:
    title: "LibreNMS: login credentials passed in the URL from {{source.ip}} (unthrottled GET login, the password is now in the logs)"
    author: Jason Tools
    description: >-
      With auth.allow_get_login on (off by default since CVE-2023-46745 was fixed in 23.11.0) a
      GET /?username=...&password=... login is not rate limited, and the password is written into
      every access and proxy log.
    references: ["Migrated from jt-librenms 4.x rule 131981", "https://github.com/advisories/GHSA-rq42-58qf-v3qx"]
  sigma_id: jt-librenms-131981
  enabled: true
  status: experimental
  level: medium
  logsource: {product: jt-librenms}
  detection:
    condition: selection and user and password
    selection:
      http.request.method: GET
      url.path: ['/', '/login']
    user:
      - url.query|startswith: username=
      - url.query|contains: '&username='
    password:
      - url.query|startswith: password=
      - url.query|contains: '&password='
  mitre:
    tactic: {id: [TA0006], name: [Credential Access]}
    technique: {id: [T1110, T1552], name: [Brute Force, Unsecured Credentials]}
  tags: [jt.rule.131981, jt.pack.jt-librenms, jt.auth.failure]

- metadata:
    title: "LibreNMS: SQL injection markers in the request to {{url.path}} from {{source.ip}}"
    author: Jason Tools
    description: >-
      SQL injection markers in a LibreNMS endpoint that takes them in the query string: time-based
      blind through the API "order" parameter (CVE-2024-32480, fixed 24.4.0), the ajax_output.php
      "hostname" parameter (CVE-2025-65093, fixed 25.11.0), and the usual UNION / FROM / WHERE forms.
      A purely boolean-blind payload (AND 1=1) carries no distinctive token and is not matched.
    references: ["Migrated from jt-librenms 4.x rule 131983", "https://github.com/advisories/GHSA-jh57-j3vq-h438", "https://github.com/advisories/GHSA-6pmj-xjxp-p8g9"]
  sigma_id: jt-librenms-131983
  enabled: true
  status: experimental
  level: high
  logsource: {product: jt-librenms}
  detection:
    condition: path and injection and not (collectd and metachar)
    path:
      url.original|startswith: *injection_paths
    injection:
      url.original|contains: *sqli
    collectd:
      url.path: /graph.php
      url.query|contains: type=device_collectd
    metachar:
      url.original|contains: &metachar [';', '|', '%3b', '%3B', '%7c', '%7C', '%60', '`', '$(', '%24%28']
  mitre:
    tactic: {id: [TA0001], name: [Initial Access]}
    technique: {id: [T1190], name: [Exploit Public-Facing Application]}
  tags: [jt.rule.131983, jt.pack.jt-librenms]

