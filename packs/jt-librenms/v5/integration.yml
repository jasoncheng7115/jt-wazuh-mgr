# jt-librenms for Wazuh 5.x (beta): LibreNMS's application log and dispatcher service are decoded
# here; its web access log is decoded by Wazuh's standard apache-http integration and the access
# rules of this pack read those events (see detector.yml), as do the file integrity rules (wazuh-fim).
# metadata.title is the integration's name in the engine and the logsource.product of every rule.
category: applications
enabled: true
metadata:
  title: jt-librenms
  author: Jason Tools
  description: >-
    LibreNMS failed logins, rejected API tokens, account, token and alerting changes, undelivered
    notifications, dispatcher failures and the access-log traces of its known exploits
    (jt-wazuh-mgr pack jt-librenms, 5.x edition, beta).
  references:
    - https://github.com/jasoncheng7115/jt-wazuh-mgr
