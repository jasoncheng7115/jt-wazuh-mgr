# Indices the jt-librenms detector reads (tools/pack5_dev.py detector).
#   applications     this pack's own events (librenms.log, the dispatcher) and the web access log,
#                    which Wazuh's standard apache-http integration decodes (nginx and Apache
#                    combined format alike) into url.*, http.* and source.ip
#   system-activity  file integrity events, decoded by the standard wazuh-fim integration
indices:
  - wazuh-events-v5-applications
  - wazuh-events-v5-system-activity
