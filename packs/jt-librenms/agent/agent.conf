<!--
  jt-librenms agent group: the LibreNMS application log.

  The web server access and error logs are read by the default Linux agent
  configuration already (/var/log/nginx/*.log, /var/log/apache2/*.log); they
  are not repeated here, because a file collected twice is sent twice.
  A file that does not exist on the host is skipped by the agent.
-->
<agent_config os="Linux">

  <!--
    One record per event: a record that spans several lines (an exception
    with its stack trace) is joined to the line that starts it.
    A new record starts at any line that is NOT a stack-trace continuation
    (# <n>, an indented line, "Stack trace:", "[stacktrace]", "{main}").
    This matches both the bracketed line of LibreNMS 25.1 and later and the
    bare "%message%" line of 23.6 to 24.12 (app/Logging/NoColorFormatter.php);
    the old "^[timestamp" pattern never matched a bare line and glued every
    record to its neighbours until the timeout. multiline_regex compiles as
    PCRE2 in Wazuh 4.14, so the negative lookahead is honoured.
    The poll and discovery timing lines are dropped: one per device per
    polling cycle (288 a day per device at the default 5 minutes), written at
    ALERT level for the dispatcher's watchdog, carrying nothing for Wazuh.
  -->
  <localfile>
    <location>/opt/librenms/logs/librenms.log</location>
    <log_format>multi-line-regex</log_format>
    <multiline_regex match="start" replace="wspace">^(?!#\d+ |\s|Stack trace:|\[stacktrace\]|\{main\})</multiline_regex>
    <ignore type="PCRE2">^(?:\[[^\]]+\]\[ALERT\] )?INFO: device:(?:poll|discover) </ignore>
  </localfile>

  <!--
    File integrity on the LibreNMS web root and its secrets, on the LibreNMS
    host only (a host without /opt/librenms skips these). restrict=".php$"
    keeps the file-integrity database small (only PHP files are tracked) and
    turns "a file added under html" into "a new PHP file appeared", which
    upstream has not done in six months of releases: rule 131994. The secrets
    (.env with APP_KEY and the database password, config.php) are watched for
    change with report_changes="no", so no secret is copied into an alert:
    rule 131995.
  -->
  <syscheck>
    <directories check_all="yes" restrict=".php$" recursion_level="8" report_changes="no">/opt/librenms/html</directories>
    <directories check_all="yes" report_changes="no">/opt/librenms/.env</directories>
    <directories check_all="yes" report_changes="no">/opt/librenms/config.php</directories>
  </syscheck>

</agent_config>
