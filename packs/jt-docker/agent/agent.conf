<!--
  jt-docker agent group: Docker API events and the daemon configuration.

  1. docker-listener: Wazuh's wodle that follows the Docker API event stream
     (docker events) and sends each event to the manager (location
     Wazuh-Docker, built-in rules 87900-87958 and this pack's 132601-132629).
     It needs Python 3 and the Python "docker" module on the agent, which the
     agent package does not install. Without the module the wodle writes
     "'docker' module needs to be installed" to the agent's own ossec.log,
     gives up after five attempts, and nothing reaches the manager. See the
     pack's setup guide for the pip command. The wodle runs as root and
     talks to /var/run/docker.sock; rootless Docker (a socket under
     /run/user/UID) is not supported by the wodle.

  2. File integrity monitoring of the daemon configuration, in real time and
     with diffs (report_changes): daemon.json, /etc/docker as a whole, the
     systemd overrides where "-H tcp://..." is usually added, /etc/default
     and /etc/sysconfig files of the Debian and Red Hat packages, and
     /etc/containerd. A default agent already scans /etc twice a day without
     diffs; these entries are more specific and take over for these paths.
     A directory that does not exist yet is picked up by the scheduled scan
     once created, and in real time after the next agent restart.
     Diffs are not kept for registry certificates and keys (nodiff), so a
     private key never ends up in an alert. The nodiff patterns below also
     apply to every other directory the agent watches: no file ending in
     .key or -key.pem gets a diff. The systemd overrides can hold proxy
     settings with a password (Environment=HTTPS_PROXY=...): such a change
     shows in the alert diff.

  The dockerd log needs nothing here when the host's syslog or journal is
  already collected (the default agent configuration does one or the other).
-->
<agent_config os="Linux">

  <wodle name="docker-listener">
    <disabled>no</disabled>
    <run_on_start>yes</run_on_start>
    <interval>1m</interval>
    <attempts>5</attempts>
  </wodle>

  <syscheck>
    <directories realtime="yes" check_all="yes" report_changes="yes" recursion_level="3">/etc/docker</directories>
    <directories realtime="yes" check_all="yes" report_changes="yes">/etc/systemd/system/docker.service.d,/etc/systemd/system/docker.socket.d,/etc/systemd/system/containerd.service.d</directories>
    <directories realtime="yes" check_all="yes" report_changes="yes" recursion_level="1">/etc/containerd</directories>
    <directories check_all="yes" report_changes="yes">/etc/default/docker,/etc/sysconfig/docker</directories>
    <nodiff type="sregex">^/etc/docker/certs.d/|^/etc/docker/tls/|^/etc/docker/ssl/|^/etc/docker/key.json$|.key$|-key.pem$</nodiff>
  </syscheck>

</agent_config>
