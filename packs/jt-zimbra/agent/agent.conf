<agent_config>

  <!--
    Zimbra log collection and file integrity monitoring, installed by the
    jt-zimbra pack. Assign your Zimbra servers to this group.

    whodata="yes" is what records which process wrote a file. Without it a web
    shell landing in the web root is reported with no attribution, which is the
    difference between an alert you can act on and one you can only stare at.

    The scheduled scan is deliberately infrequent: realtime and whodata carry the
    detection, and a full tree walk of a mail store every hour costs more than it
    finds.
  -->

  <localfile><log_format>syslog</log_format><location>/opt/zimbra/log/mailbox.log</location></localfile>
  <localfile><log_format>syslog</log_format><location>/opt/zimbra/log/audit.log</location></localfile>
  <localfile><log_format>apache</log_format><location>/opt/zimbra/log/access_log</location></localfile>
  <localfile><log_format>apache</log_format><location>/opt/zimbra/log/nginx.access.log</location></localfile>
  <localfile><log_format>syslog</log_format><location>/opt/zimbra/log/amavisd.log</location></localfile>

  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>

    <!-- Web root: realtime, with whodata so the writing process is recorded,
         and report_changes so the content diff is available. -->
    <directories check_all="yes" realtime="yes" whodata="yes" report_changes="yes">/opt/zimbra/jetty_base/webapps</directories>

    <!-- Java extensions: the most dangerous place a file can appear on a Zimbra
         host, because a module here can hook authentication. -->
    <directories check_all="yes" realtime="yes" whodata="yes">/opt/zimbra/lib/ext</directories>

    <directories check_all="yes" realtime="yes" whodata="yes">/opt/zimbra/zimlets-deployed</directories>
    <directories check_all="yes" realtime="yes">/opt/zimbra/conf</directories>
    <directories check_all="yes" realtime="yes" whodata="yes">/opt/zimbra/bin</directories>

    <!-- System-level persistence, which is where an attacker goes next. -->
    <directories check_all="yes" realtime="yes" whodata="yes">/etc/cron.d,/etc/cron.hourly,/etc/cron.daily,/var/spool/cron</directories>
    <directories check_all="yes" realtime="yes" whodata="yes">/etc/systemd/system</directories>
    <directories check_all="yes" realtime="yes" whodata="yes">/opt/zimbra/.ssh,/root/.ssh</directories>

    <ignore type="sregex">\.log$|\.tmp$|/data/tmp/</ignore>
  </syscheck>

</agent_config>
