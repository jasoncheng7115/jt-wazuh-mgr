<agent_config>

  <!--
    Zimbra log collection and file integrity monitoring, installed by the
    jt-zimbra pack. Assign your Zimbra servers to this group.

    whodata="yes" is what records which process wrote a file. Without it a web
    shell landing in the web root is reported with no attribution, which is the
    difference between an alert you can act on and one you can only stare at.

    The scheduled scan is deliberately infrequent: realtime and whodata carry the
    detection, and a full tree walk of a mail store every hour costs more than it
    finds.

    A file already listed in the agent's own ossec.conf is not read twice: the
    agent keeps the first entry and logs "(1958) ... is duplicated" for this
    one. That makes the localfile entries below safe on a host that already
    collects them.
  -->

  <!-- The Zimbra logs the rules read. The rules count only these file copies;
       when the server also sends mailbox and audit lines to syslog
       (zimbraLogToSyslog), the syslog copies are decoded and dropped. -->
  <localfile><log_format>syslog</log_format><location>/opt/zimbra/log/mailbox.log</location></localfile>
  <localfile><log_format>syslog</log_format><location>/opt/zimbra/log/audit.log</location></localfile>
  <localfile><log_format>apache</log_format><location>/opt/zimbra/log/access_log</location></localfile>
  <localfile><log_format>apache</log_format><location>/opt/zimbra/log/nginx.access.log</location></localfile>
  <localfile><log_format>syslog</log_format><location>/opt/zimbra/log/amavisd.log</location></localfile>

  <!-- Zimbra's rsyslog rules write Postfix, amavis, opendkim, zmconfigd and
       zimbramon here. Do not ALSO collect /var/log/mail.log on a Zimbra
       server: it holds the same Postfix lines, and every one of them arrives
       twice (measured: 377,000 duplicate alerts in 41 days on one server). -->
  <!-- 3.3: saslauthd checks every SMTP AUTH password against Zimbra and,
       at debug level, logs Zimbra's whole answer, the session token
       included (auth_zimbra "zmpost: url=... returned buffer->data=
       ...<authToken>0_...</authToken><lifetime>172799997</lifetime>..."):
       a token valid for two days for every account that sends mail through
       SMTP AUTH. Zimbra's rsyslog rule (auth.* in
       /etc/rsyslog.d/60-zimbra.conf) writes debug lines to this file by
       default, so the agent would copy every token to the manager and to
       its archives. Those lines are left on the host; nothing a rule uses
       is in them. (ignore needs agent 4.6 or later.) -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/zimbra.log</location>
    <ignore type="PCRE2">saslauthd\[\d+\]:? zmpost: </ignore>
  </localfile>

  <!-- A Zimbra restart writes thousands of lines in a few seconds (service
       start-up, every configuration file rewritten). With the default queue
       of 5,000 events the agent reported its buffer full or flooded 705 times
       in 41 days on one server, always at the nightly and early-morning
       restarts, and the events in those minutes were lost. A larger queue
       absorbs the burst; the send rate stays at the default. -->
  <client_buffer>
    <disabled>no</disabled>
    <queue_size>50000</queue_size>
    <events_per_second>500</events_per_second>
  </client_buffer>

  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>

    <!-- Web root: realtime, with whodata so the writing process is recorded,
         and report_changes so the content diff is available. -->
    <directories check_all="yes" realtime="yes" whodata="yes" report_changes="yes">/opt/zimbra/jetty_base/webapps</directories>

    <!-- Java extensions: the most dangerous place a file can appear on a Zimbra
         host, because a module here can hook authentication. -->
    <directories check_all="yes" realtime="yes" whodata="yes">/opt/zimbra/lib/ext</directories>

    <directories check_all="yes" realtime="yes" whodata="yes">/opt/zimbra/zimlets-deployed</directories>

    <!-- Configuration. zmconfigd rewrites its output files on every restart,
         mostly with identical contents, so mtime and inode are not checked
         here: a change in contents, permissions or owner still is.
         Measured: 76% of 8,163 alerts in 41 days were mtime or inode alone. -->
    <directories check_all="yes" check_mtime="no" check_inode="no" realtime="yes">/opt/zimbra/conf</directories>
    <directories check_all="yes" realtime="yes" whodata="yes">/opt/zimbra/bin</directories>

    <!-- System-level persistence, which is where an attacker goes next.
         3.4: the rules for these files are in the jt-linux-integrity pack
         (install it; jt-zimbra no longer has them). The entries stay here so
         a Zimbra server that is not also in the linux-integrity group still
         reports them, and they carry the same options as that group's
         entries for the same paths: a path listed twice keeps only the last
         entry the agent reads, so the two groups must not disagree. -->
    <directories check_all="yes" realtime="yes" whodata="yes" report_changes="yes">/etc/cron.d,/etc/cron.hourly,/etc/cron.daily,/var/spool/cron</directories>
    <directories check_all="yes" realtime="yes" whodata="yes" report_changes="yes">/etc/systemd/system</directories>
    <!-- at job files hold the submitting user's whole environment: no diff. -->
    <nodiff type="sregex">^/var/spool/cron/atjobs/|^/var/spool/cron/atspool/|^/var/spool/at/</nodiff>
    <directories check_all="yes" realtime="yes" whodata="yes">/opt/zimbra/.ssh,/root/.ssh</directories>

    <!-- 3.2: PAM and sudo (3.4: rules in jt-linux-integrity). After
         CVE-2026-73570 attackers hooked /etc/pam.d/sudo with pam_exec and
         gave the zimbra account "NOPASSWD: ALL". report_changes keeps a
         diff, which is how the rules see the line that was added; these files
         hold no secrets. A few dozen small files. -->
    <directories check_all="yes" realtime="yes" whodata="yes" report_changes="yes">/etc/pam.d,/etc/sudoers,/etc/sudoers.d</directories>

    <!-- Attacker tooling in temporary directories (rules 100807, 100809).
         restrict is OS_Match too: ".jsp$|.sh$" works, "\.(jsp|sh)$" matches
         nothing at all (tested on 4.14.7). recursion_level keeps a busy /tmp
         from filling the FIM database. -->
    <directories check_all="yes" realtime="yes" whodata="yes" recursion_level="3" restrict=".jsp$|.jspx$|.class$|.jar$|.war$|.sh$|.py$|.pl$|.elf$|.bin$">/tmp,/var/tmp,/dev/shm</directories>

    <ignore type="sregex">.log$|.tmp$|/data/tmp/</ignore>

    <!-- Files Zimbra regenerates from a template (the *.in files and
         conf/nginx/templates/ stay monitored: an edit there survives a
         restart, an edit to a generated file does not). sregex is OS_Match:
         only ^ $ | ! are special, a dot is a dot, no parentheses. -->
    <ignore type="sregex">^/opt/zimbra/conf/nginx/includes/|^/opt/zimbra/conf/nginx.conf$|^/opt/zimbra/conf/amavisd.conf$|^/opt/zimbra/conf/clamd.conf$|^/opt/zimbra/conf/freshclam.conf$|^/opt/zimbra/conf/opendkim.conf$|^/opt/zimbra/conf/opendkim-localnets.conf$|^/opt/zimbra/conf/saslauthd.conf$|^/opt/zimbra/conf/stats.conf$|^/opt/zimbra/conf/snmpd.conf$|^/opt/zimbra/conf/unbound.conf$|^/opt/zimbra/conf/dspam.conf$|^/opt/zimbra/conf/cbpolicyd.conf$|^/opt/zimbra/conf/mta_milter_options$|^/opt/zimbra/conf/postfix_header_checks$|^/opt/zimbra/conf/swatchrc$|^/opt/zimbra/conf/spnego_java_options$|^/opt/zimbra/conf/log4j.properties$|^/opt/zimbra/conf/salocal.cf$</ignore>
  </syscheck>

</agent_config>
