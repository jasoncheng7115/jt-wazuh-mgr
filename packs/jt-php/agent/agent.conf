<!--
  php: what the jt-php rules need from a host that runs PHP.

  Logs. PHP-FPM's own log, where a worker killed by SIGSEGV is written, is
  read by no default configuration. The web servers' error logs carry PHP's
  "Allowed memory size ... in Unknown on line 0"; the web group reads them
  too, and a file listed in two groups is read once.

  Configuration. php.ini, conf.d and the FPM pool files, in real time, with
  diffs: the rules read the diff for auto_prepend_file, allow_url_include,
  and removed disable_functions / open_basedir. Only *.ini and *.conf files.
  A path listed in two groups keeps only the last entry's options (4.14), so
  this group lists only PHP's own directories, never /etc as a whole.
  Diffs are copied into alerts. A pool file can hold env[DB_PASSWORD] or a
  php_admin_value with a credential, and session.save_path can hold a Redis
  password: if yours do, change report_changes to "no" here; then only the
  diff-based rules 133142 and 133143 stop working.

  Web shells. The rules for PHP files in upload directories work on whatever
  the host's own FIM watches; this group adds no web root, because a web
  root listed here would replace the options a site already uses for it.

  Commands. jt-php.rules is delivered to /var/ossec/etc/shared/; loading it
  into auditd is a separate, optional step (see the pack's setup).

  Configuration assessment. jt-php-sca*.yml report whether session upload
  progress is off (CVE-2026-115560, October 2026), file reads only.

  The group runs no command on the agent.
-->
<agent_config os="Linux">
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/php*-fpm.log</location>
  </localfile>
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/php-fpm/*.log</location>
  </localfile>
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/php*/error.log</location>
  </localfile>
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/opt/remi/php*/log/php-fpm/*.log</location>
  </localfile>
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/apache2/*error*.log</location>
  </localfile>
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/httpd/*error*log</location>
  </localfile>
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/nginx/*error*.log</location>
  </localfile>

  <syscheck>
    <directories realtime="yes" report_changes="yes" check_all="yes" restrict="\.ini$|\.conf$">/etc/php,/etc/php.d,/etc/php-fpm.d,/etc/opt/remi</directories>
    <directories realtime="yes" report_changes="yes" check_all="yes">/etc/php.ini,/etc/php-fpm.conf</directories>
  </syscheck>
  <!-- CVE-2026-115560: is session upload progress off? (jt-php 1.1) One
       policy per layout; a host runs only the one whose files it has. -->
  <sca>
    <policies>
      <policy>etc/shared/jt-php-sca.yml</policy>
      <policy>etc/shared/jt-php-sca-rhel.yml</policy>
    </policies>
  </sca>
</agent_config>

<agent_config os="FreeBSD">
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/php-fpm.log</location>
  </localfile>
  <syscheck>
    <directories realtime="yes" report_changes="yes" check_all="yes" restrict="\.ini$|\.conf$">/usr/local/etc/php,/usr/local/etc/php-fpm.d</directories>
    <directories realtime="yes" report_changes="yes" check_all="yes">/usr/local/etc/php.ini,/usr/local/etc/php-fpm.conf</directories>
  </syscheck>
  <sca>
    <policies>
      <policy>etc/shared/jt-php-sca-freebsd.yml</policy>
    </policies>
  </sca>
</agent_config>
