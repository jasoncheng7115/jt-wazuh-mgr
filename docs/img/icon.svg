<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="jt-wazuh-mgr">
  <!--
    jt-wazuh-mgr project mark.

    The JT cube is the author's company logo and stays that. This is the
    project's own mark: one manager holding a cluster of agents. A hub with
    three linked nodes, inside the outline of a shield, because what the tool
    manages is a security agent estate.

    Drawn to survive 16 pixels: four solid discs and three straight links, no
    gradient, no hairline, no text. The palette is the JT blue and orange so the
    two marks read as a family without being the same picture.
  -->
  <defs>
    <clipPath id="tile">
      <rect x="0" y="0" width="64" height="64" rx="14" ry="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="64" height="64" fill="#0f1b2d"/>
    <!-- shield silhouette, held back so the nodes stay the subject -->
    <path d="M32 8 L52 15 v16 c0 12-8 19-20 25 C20 50 12 43 12 31 V15 Z"
          fill="#16273f"/>
  </g>

  <!-- links first, so the discs sit on top of them -->
  <g stroke="#2ba6f7" stroke-width="3.4" stroke-linecap="round" opacity=".95">
    <line x1="32" y1="32" x2="32" y2="17.5"/>
    <line x1="32" y1="32" x2="19.5" y2="41"/>
    <line x1="32" y1="32" x2="44.5" y2="41"/>
  </g>

  <!-- agents -->
  <g fill="#2ba6f7">
    <circle cx="32" cy="17.5" r="5.2"/>
    <circle cx="19.5" cy="41" r="5.2"/>
    <circle cx="44.5" cy="41" r="5.2"/>
  </g>

  <!-- the manager -->
  <circle cx="32" cy="32" r="8" fill="#f7941e"/>
  <circle cx="32" cy="32" r="3.1" fill="#0f1b2d"/>
</svg>
